<!DOCTYPE html>
<html lang="ur">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Markaz Admin Control Panel</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4 font-sans">

    <div class="max-w-xl mx-auto space-y-6">

        <!-- Top Header -->
        <header class="flex items-center justify-between border-b border-slate-800 pb-4">
            <div>
                <h1 class="text-2xl font-bold text-white flex items-center gap-2">
                    🛍️ Markaz Admin
                </h1>
                <p class="text-xs text-slate-400">CONTROL PANEL</p>
            </div>
            <a href="index.html" class="text-xs bg-slate-800 hover:bg-slate-700 text-indigo-400 px-3 py-2 rounded-lg font-semibold border border-slate-700">
                View Store ↗
            </a>
        </header>

        <!-- ADD MANUAL PRODUCT WITH GALLERY UPLOAD -->
        <div class="bg-slate-800/80 p-5 rounded-2xl border border-slate-700/60 shadow-lg space-y-4">
            <h2 class="text-lg font-bold text-indigo-400 flex items-center gap-2">
                🛒 Add Product To Store
            </h2>

            <form id="manualProductForm" onsubmit="handleProductSubmit(event)" class="space-y-4">

                <!-- Product Name -->
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">
                        Product Name *
                    </label>
                    <input 
                        type="text" 
                        id="pName" 
                        placeholder="e.g. Smart Watch Series 8" 
                        required 
                        class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500"
                    />
                </div>

                <!-- Product Price (PKR) -->
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">
                        Price (PKR) *
                    </label>
                    <input 
                        type="number" 
                        id="pPrice" 
                        placeholder="e.g. 2500" 
                        required 
                        class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500"
                    />
                </div>

                <!-- Category -->
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">
                        Category *
                    </label>
                    <select 
                        id="pCategory" 
                        required 
                        class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-indigo-500"
                    >
                        <option value="Electronics">Electronics</option>
                        <option value="Beauty">Beauty</option>
                        <option value="Watches">Watches</option>
                        <option value="Clothing">Clothing</option>
                        <option value="Accessories">Accessories</option>
                        <option value="Home & Garden">Home & Garden</option>
                    </select>
                </div>

                <!-- 📸 GALLERY PHOTO UPLOAD SECTION (STORAGE SAFE) -->
                <div class="bg-slate-900/60 p-4 rounded-xl border border-slate-700 space-y-3">
                    <label class="block text-xs font-bold text-indigo-300">
                        📸 Product Photo (Mobile Gallery Se Select Karein)
                    </label>
                    
                    <!-- File Input -->
                    <input 
                        type="file" 
                        id="productFileInput" 
                        accept="image/*" 
                        onchange="autoUploadToImgBB(event)"
                        class="w-full text-xs text-slate-400 file:mr-4 file:py-2.5 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-indigo-600 file:text-white hover:file:bg-indigo-500 cursor-pointer"
                    />

                    <!-- Status Text -->
                    <p id="uploadStatusText" class="text-xs font-medium text-slate-400"></p>

                    <!-- Preview Tag -->
                    <div id="previewContainer" class="hidden">
                        <p class="text-[10px] text-slate-400 mb-1">Uploaded Photo Preview:</p>
                        <img id="imagePreviewTag" src="" alt="Preview" class="w-24 h-24 object-cover rounded-xl border-2 border-emerald-500 shadow-md" />
                    </div>

                    <!-- Hidden Input for ImgBB URL -->
                    <input type="hidden" id="finalImageUrl" value="" />
                </div>

                <!-- Submit Button -->
                <button 
                    type="submit" 
                    id="saveProductBtn"
                    class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3.5 rounded-xl transition duration-200 shadow-lg text-center"
                >
                    ➕ Save Product To Store
                </button>

            </form>
        </div>

    </div>

    <!-- SCRIPT LOGIC -->
    <script>
        // 1. AUTO UPLOAD TO IMGBB (Zero Server Storage Use)
        async function autoUploadToImgBB(event) {
            const file = event.target.files[0];
            if (!file) return;

            const statusText = document.getElementById('uploadStatusText');
            const previewContainer = document.getElementById('previewContainer');
            const previewImg = document.getElementById('imagePreviewTag');
            const finalUrlInput = document.getElementById('finalImageUrl');

            statusText.innerText = "⏳ Photo upload ho rahi hai...";
            statusText.className = "text-xs font-medium text-amber-400";

            const IMGBB_API_KEY = "3b0a7dd514f1640a35db4057884ff358";
            const formData = new FormData();
            formData.append("image", file);

            try {
                const res = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, {
                    method: "POST",
                    body: formData
                });

                const result = await res.json();

                if (result.success) {
                    const imageUrl = result.data.display_url;
                    finalUrlInput.value = imageUrl;
                    previewImg.src = imageUrl;
                    previewContainer.classList.remove('hidden');

                    statusText.innerText = "✅ Photo kamyabi se upload ho gayi!";
                    statusText.className = "text-xs font-medium text-emerald-400";
                } else {
                    statusText.innerText = "❌ Photo upload nahi ho saki!";
                    statusText.className = "text-xs font-medium text-rose-500";
                }
            } catch (err) {
                console.error(err);
                statusText.innerText = "❌ Network Error! Dobara koshish karein.";
                statusText.className = "text-xs font-medium text-rose-500";
            }
        }

        // 2. SAVE MANUAL PRODUCT FORM SUBMIT
        function handleProductSubmit(event) {
            event.preventDefault();

            const imgUrl = document.getElementById('finalImageUrl').value || "https://via.placeholder.com/300";

            const productData = {
                title: document.getElementById('pName').value,
                price: document.getElementById('pPrice').value,
                category: document.getElementById('pCategory').value,
                images: [imgUrl]
            };

            // LocalStorage key synced with main script.js ('myProducts')
            let storeProducts = JSON.parse(localStorage.getItem('myProducts')) || [];
            storeProducts.push(productData);
            localStorage.setItem('myProducts', JSON.stringify(storeProducts));

            alert("🎉 Product Store Mein Successfully Add Ho Gaya!");
            document.getElementById('manualProductForm').reset();
            document.getElementById('previewContainer').classList.add('hidden');
            document.getElementById('uploadStatusText').innerText = "";
        }
    </script>
</body>
</html>
