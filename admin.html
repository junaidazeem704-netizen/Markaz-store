<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Admin Panel - Markaz Store</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #0a0a12; color: #ffffff; padding: 12px; min-height: 100vh; }
        .admin-wrapper { max-width: 700px; margin: 0 auto; }
        .admin-header { display: flex; justify-content: space-between; align-items: center; padding: 14px 18px; background: rgba(26, 26, 46, 0.85); border: 1px solid rgba(255, 255, 255, 0.06); border-radius: 14px; margin-bottom: 16px; flex-wrap: wrap; gap: 8px; }
        .admin-header h1 { font-size: 1.1rem; font-weight: 800; background: linear-gradient(135deg, #6366f1, #8b5cf6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .admin-header-actions a { padding: 5px 12px; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.06); border-radius: 8px; color: #a0a0b8; text-decoration: none; font-size: 0.7rem; }
        .admin-stats { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 16px; }
        .admin-stat-card { background: rgba(26, 26, 46, 0.85); border: 1px solid rgba(255, 255, 255, 0.06); border-radius: 10px; padding: 12px 14px; text-align: center; }
        .admin-stat-card .label { font-size: 0.6rem; color: #a0a0b8; text-transform: uppercase; }
        .admin-stat-card .value { font-size: 1.3rem; font-weight: 700; background: linear-gradient(135deg, #6366f1, #8b5cf6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .admin-card { background: rgba(26, 26, 46, 0.85); border: 1px solid rgba(255, 255, 255, 0.06); border-radius: 14px; padding: 16px 18px; margin-bottom: 14px; }
        .admin-card h2 { font-size: 0.95rem; font-weight: 700; margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }
        .admin-card h2 i { color: #6366f1; }
        .admin-card .badge { background: linear-gradient(135deg, #6366f1, #8b5cf6); color: white; font-size: 0.6rem; padding: 2px 8px; border-radius: 100px; margin-left: 6px; }
        .form-group { margin-bottom: 10px; }
        .form-group label { font-size: 0.75rem; font-weight: 500; color: #a0a0b8; display: block; margin-bottom: 3px; }
        .form-group label .required { color: #ef4444; }
        .form-group input, .form-group textarea { width: 100%; padding: 10px 14px; background: rgba(255, 255, 255, 0.04); border: 1px solid rgba(255, 255, 255, 0.06); border-radius: 8px; color: #ffffff; font-size: 0.9rem; outline: none; font-family: inherit; }
        .form-group textarea { resize: vertical; min-height: 60px; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .form-actions { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-top: 6px; }
        .btn-primary { width: 100%; padding: 12px; background: linear-gradient(135deg, #6366f1, #8b5cf6); border: none; border-radius: 8px; color: white; font-size: 0.85rem; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; }
        .btn-secondary { width: 100%; padding: 12px; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.06); border-radius: 8px; color: #a0a0b8; font-size: 0.85rem; font-weight: 500; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; }
        .btn-sm { padding: 5px 12px; font-size: 0.7rem; width: auto; display: inline-flex; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.06); border-radius: 6px; color: #a0a0b8; cursor: pointer; }
        .btn-edit, .btn-danger-sm { padding: 3px 8px; font-size: 0.6rem; border-radius: 5px; cursor: pointer; }
        .btn-edit { background: rgba(99, 102, 241, 0.12); border: 1px solid rgba(99, 102, 241, 0.2); color: #6366f1; }
        .btn-danger-sm { background: rgba(239, 68, 68, 0.12); border: 1px solid rgba(239, 68, 68, 0.2); color: #ef4444; }

        .image-upload-area { border: 2px dashed rgba(255, 255, 255, 0.08); border-radius: 8px; padding: 16px; text-align: center; cursor: pointer; position: relative; background: rgba(255, 255, 255, 0.02); margin-bottom: 8px; }
        .image-upload-area input[type="file"] { position: absolute; top: 0; left: 0; right: 0; bottom: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%; z-index: 5; }
        .image-upload-area i { font-size: 1.5rem; color: #6366f1; margin-bottom: 4px; }
        .image-upload-area p { color: #a0a0b8; font-size: 0.75rem; }
        .image-preview-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(65px, 1fr)); gap: 8px; margin-top: 8px; }
        .image-preview-item { position: relative; border-radius: 6px; overflow: hidden; aspect-ratio: 1; background: rgba(255, 255, 255, 0.04); border: 1px solid rgba(255, 255, 255, 0.06); }
        .image-preview-item img { width: 100%; height: 100%; object-fit: cover; }
        .image-preview-item .remove-img { position: absolute; top: 2px; right: 2px; width: 18px; height: 18px; border-radius: 50%; background: rgba(0, 0, 0, 0.8); border: none; color: white; cursor: pointer; font-size: 0.5rem; display: flex; align-items: center; justify-content: center; }

        .options-group, .category-tags { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 3px; min-height: 24px; }
        .option-tag, .category-tag { display: flex; align-items: center; gap: 3px; padding: 3px 8px; background: rgba(255, 255, 255, 0.06); border-radius: 100px; font-size: 0.7rem; }
        .option-tag .remove, .category-tag .remove { cursor: pointer; color: #ef4444; background: none; border: none; font-size: 0.7rem; }
        .option-input-row, .category-input-row { display: flex; gap: 5px; margin-top: 5px; }
        .option-input-row input, .category-input-row input { flex: 1; padding: 5px 10px; background: rgba(255, 255, 255, 0.04); border: 1px solid rgba(255, 255, 255, 0.06); border-radius: 6px; color: #ffffff; font-size: 0.8rem; outline: none; }

        .product-list { display: flex; flex-direction: column; gap: 5px; max-height: 300px; overflow-y: auto; }
        .product-item { display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; background: rgba(255, 255, 255, 0.03); border-radius: 6px; border: 1px solid rgba(255, 255, 255, 0.06); gap: 4px; }
        .product-item .info { display: flex; align-items: center; gap: 8px; }
        .product-item .info img { width: 32px; height: 32px; object-fit: cover; border-radius: 5px; }
        .product-item .info .title { font-weight: 500; font-size: 0.8rem; }
        .product-item .info .meta { font-size: 0.6rem; color: #a0a0b8; }

        .empty-state { text-align: center; padding: 24px 16px; color: #6a6a82; display: none; }
        .order-item { display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; background: rgba(255, 255, 255, 0.03); border-radius: 6px; border: 1px solid rgba(255, 255, 255, 0.06); margin-bottom: 5px; gap: 4px; }
        .order-item .order-info .order-id { font-weight: 600; font-size: 0.75rem; }
        .order-item .order-info .order-meta { font-size: 0.6rem; color: #a0a0b8; }
        .order-item .order-status select { padding: 3px 6px; background: rgba(255, 255, 255, 0.04); border: 1px solid rgba(255, 255, 255, 0.06); border-radius: 5px; color: #ffffff; font-size: 0.65rem; }
        .order-status-badge { padding: 2px 8px; border-radius: 100px; font-size: 0.55rem; font-weight: 600; }
        .order-status-badge.processing { background: rgba(245, 158, 11, 0.15); color: #f59e0b; }
        .order-status-badge.shipped { background: rgba(99, 102, 241, 0.15); color: #6366f1; }
        .order-status-badge.delivered { background: rgba(16, 185, 129, 0.15); color: #10b981; }
        .order-status-badge.cancelled { background: rgba(239, 68, 68, 0.15); color: #ef4444; }

        .order-stats { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 12px; }
        .order-stat-box { background: rgba(255, 255, 255, 0.04); padding: 8px; border-radius: 6px; text-align: center; }
        .order-stat-box .stat-label { font-size: 0.55rem; color: #a0a0b8; }
        .order-stat-box .stat-value { font-size: 1rem; font-weight: 700; }
        .edit-mode-badge { background: #f59e0b; color: white; font-size: 0.55rem; padding: 2px 6px; border-radius: 100px; margin-left: 6px; }
        .hidden { display: none !important; }

        .toast { position: fixed; bottom: 16px; left: 16px; right: 16px; background: rgba(26, 26, 46, 0.95); border: 1px solid rgba(255, 255, 255, 0.06); border-radius: 10px; padding: 10px 14px; display: flex; align-items: center; gap: 8px; z-index: 9999; transform: translateY(120px); opacity: 0; transition: all 0.4s ease; }
        .toast.show { transform: translateY(0); opacity: 1; }
        .toast-content { flex: 1; }
        .toast-title { font-size: 0.7rem; font-weight: 600; }
        .toast-message { font-size: 0.65rem; color: #a0a0b8; }
        .toast-close { background: none; border: none; color: #6a6a82; cursor: pointer; font-size: 0.9rem; }
    </style>
</head>
<body>

    <div class="admin-wrapper">
        <header class="admin-header">
            <h1>⚙️ Admin Panel</h1>
            <div class="admin-header-actions">
                <a href="index.html"><i class="fas fa-store"></i> Store</a>
            </div>
        </header>

        <div class="admin-stats">
            <div class="admin-stat-card"><div class="label">📦 Products</div><div class="value" id="total-products">0</div></div>
            <div class="admin-stat-card"><div class="label">🏷️ Categories</div><div class="value" id="total-categories">0</div></div>
            <div class="admin-stat-card"><div class="label">📊 Orders</div><div class="value" id="total-orders">0</div></div>
        </div>

        <!-- Add Product -->
        <div class="admin-card">
            <h2><i class="fas fa-plus-circle"></i> <span id="form-title">Add Product</span>
            <span class="edit-mode-badge hidden" id="edit-badge">Editing</span></h2>
            <input type="hidden" id="edit-id" value="" />

            <div class="form-group">
                <label>Title <span class="required">*</span></label>
                <input type="text" id="p-title" placeholder="e.g. Rolex Watch" />
            </div>
            <div class="form-group">
                <label>Price (PKR) <span class="required">*</span></label>
                <input type="number" id="p-price" placeholder="2500" />
            </div>
            <div class="form-group">
                <label>Description</label>
                <textarea id="p-description" placeholder="Product details..."></textarea>
            </div>
            <div class="form-group">
                <label>Category</label>
                <input type="text" id="p-category" placeholder="Watches, Clothing, etc." />
            </div>

            <!-- Image Upload & URL Section -->
            <div class="form-group">
                <label>Images <span class="required">*</span></label>
                <div class="image-upload-area">
                    <i class="fas fa-cloud-upload-alt"></i>
                    <p>Tap to select gallery images</p>
                    <input type="file" id="p-images" accept="image/*" multiple onchange="handleFileSelect(event)" />
                </div>
                
                <div style="display:flex; gap:6px; margin-top:6px;">
                    <input type="url" id="p-img-url" placeholder="OR paste Image URL (https://...)" style="flex:1; font-size:0.75rem; padding:8px;" />
                    <button class="btn-sm" type="button" onclick="addUrlImage()"><i class="fas fa-plus"></i> Add URL</button>
                </div>
                
                <small id="file-count" style="margin-top:6px; color:#6366f1; display:block;">0 / 5 images selected</small>
                <div class="image-preview-grid" id="image-preview-grid"></div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Sizes</label>
                    <div class="options-group" id="sizes-container"></div>
                    <div class="option-input-row">
                        <input type="text" id="size-input" placeholder="S, M, L" />
                        <button class="btn-sm" type="button" onclick="addOption('size')">+</button>
                    </div>
                </div>
                <div class="form-group">
                    <label>Colors</label>
                    <div class="options-group" id="colors-container"></div>
                    <div class="option-input-row">
                        <input type="text" id="color-input" placeholder="Silver, Gold" />
                        <button class="btn-sm" type="button" onclick="addOption('color')">+</button>
                    </div>
                </div>
            </div>

            <div class="form-actions">
                <button class="btn-primary" id="submit-btn" onclick="saveProduct()"><i class="fas fa-plus"></i> Add Product</button>
                <button class="btn-secondary hidden" id="cancel-btn" onclick="cancelEdit()">Cancel</button>
                <button class="btn-secondary" type="button" onclick="autoDetectCategory()"><i class="fas fa-magic"></i> Auto Cat</button>
            </div>
        </div>

        <!-- Categories -->
        <div class="admin-card">
            <h2><i class="fas fa-tags"></i> Categories</h2>
            <div class="category-input-row">
                <input type="text" id="new-cat-name" placeholder="New category..." />
                <button class="btn-sm" onclick="addCategory()">Add</button>
            </div>
            <div class="category-tags" id="categories-list"></div>
        </div>

        <!-- Products List -->
        <div class="admin-card">
            <h2><i class="fas fa-box"></i> Products <span class="badge" id="product-count">0</span></h2>
            <div class="product-list" id="products-list"></div>
            <div class="empty-state" id="empty-state"><i class="fas fa-box-open"></i> No products</div>
        </div>

        <!-- Orders -->
        <div class="admin-card">
            <h2><i class="fas fa-truck"></i> Order Management</h2>
            <div class="order-stats">
                <div class="order-stat-box"><div class="stat-label">Total</div><div class="stat-value" id="order-total-count">0</div></div>
                <div class="order-stat-box"><div class="stat-label">Delivered</div><div class="stat-value" id="order-delivered-count" style="color:#10b981;">0</div></div>
                <div class="order-stat-box"><div class="stat-label">Cancelled</div><div class="stat-value" id="order-cancelled-count" style="color:#ef4444;">0</div></div>
            </div>
            <div id="order-list"></div>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast">
        <div class="toast-content"><span class="toast-title">Notice</span><span class="toast-message" id="toast-msg">Done</span></div>
    </div>

    <script>
        const SUPABASE_URL = 'https://vnzipnxrasonkhlwcynq.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZuemlwbnhyYXNvbmtobHdjeW5xIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDA5MjY0ODcsImV4cCI6MjA1NjUwMjQ4N30.KfgUQ-fn1L0A_Jv3pFESuC8jR1R7S_iC9RPNlWpTbJ0';
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        const IMGBB_API_KEY = '311cba478ef03480a9e99f45226dc6ac';

        let productsList = [], categoriesList = [], ordersList = [];
        let imageList = []; // Stores URLs or Data URLs
        let rawFiles = [];  // Stores actual File objects
        let sizes = [], colors = [], editId = null;

        document.addEventListener('DOMContentLoaded', loadAllData);

        async function loadAllData() {
            await Promise.all([loadProducts(), loadCategories(), loadOrders()]);
            updateStats();
        }

        async function loadProducts() {
            const { data } = await supabase.from('products').select('*').order('created_at', { ascending: false });
            productsList = data || [];
            renderProducts();
        }

        async function loadCategories() {
            const { data } = await supabase.from('categories').select('*').order('name', { ascending: true });
            categoriesList = data || [];
            renderCategories();
        }

        async function loadOrders() {
            const { data } = await supabase.from('orders').select('*').order('created_at', { ascending: false });
            ordersList = data || [];
            renderOrders();
        }

        // --- File & Image Handler ---
        function handleFileSelect(e) {
            const files = e.target.files;
            if (!files || !files.length) return;

            for (let i = 0; i < files.length; i++) {
                if (imageList.length >= 5) { showToast('Max 5 images allowed!'); break; }
                const file = files[i];
                rawFiles.push(file);
                const reader = new FileReader();
                reader.onload = function(evt) {
                    imageList.push(evt.target.result);
                    renderPreviews();
                };
                reader.readAsDataURL(file);
            }
        }

        function addUrlImage() {
            const input = document.getElementById('p-img-url');
            const url = input.value.trim();
            if (!url) return;
            if (imageList.length >= 5) { showToast('Max 5 images allowed!'); return; }
            imageList.push(url);
            rawFiles.push(null); // No raw file for URL
            input.value = '';
            renderPreviews();
        }

        function renderPreviews() {
            const grid = document.getElementById('image-preview-grid');
            document.getElementById('file-count').textContent = imageList.length + ' / 5 images selected';
            grid.innerHTML = imageList.map((img, i) => `
                <div class="image-preview-item">
                    <img src="${img}" />
                    <button class="remove-img" onclick="removeImage(${i})">×</button>
                </div>
            `).join('');
        }

        function removeImage(index) {
            imageList.splice(index, 1);
            rawFiles.splice(index, 1);
            renderPreviews();
        }

        // --- Options ---
        function addOption(type) {
            const input = document.getElementById(type === 'size' ? 'size-input' : 'color-input');
            const arr = type === 'size' ? sizes : colors;
            if (!input.value.trim() || arr.includes(input.value.trim())) return;
            arr.push(input.value.trim());
            input.value = '';
            renderOptions(type);
        }

        function removeOption(type, i) {
            (type === 'size' ? sizes : colors).splice(i, 1);
            renderOptions(type);
        }

        function renderOptions(type) {
            const container = document.getElementById(type === 'size' ? 'sizes-container' : 'colors-container');
            const arr = type === 'size' ? sizes : colors;
            container.innerHTML = arr.map((item, i) => `
                <span class="option-tag">${item}<button class="remove" onclick="removeOption('${type}', ${i})">×</button></span>
            `).join('');
        }

        // --- Save Product ---
        async function saveProduct() {
            const title = document.getElementById('p-title').value.trim();
            const price = document.getElementById('p-price').value.trim();
            const description = document.getElementById('p-description').value.trim();
            const category = document.getElementById('p-category').value.trim() || 'General';

            if (!title || !price) { showToast('Title and Price required!'); return; }
            if (imageList.length === 0) { showToast('Select at least 1 image!'); return; }

            const submitBtn = document.getElementById('submit-btn');
            submitBtn.disabled = true;
            submitBtn.innerHTML = 'Uploading...';

            let finalUrls = [];

            for (let i = 0; i < imageList.length; i++) {
                let img = imageList[i];
                let file = rawFiles[i];

                if (img.startsWith('http://') || img.startsWith('https://')) {
                    finalUrls.push(img);
                } else if (file) {
                    try {
                        const formData = new FormData();
                        formData.append('image', file);
                        const res = await fetch('https://api.imgbb.com/1/upload?key=' + IMGBB_API_KEY, { method: 'POST', body: formData });
                        const data = await res.json();
                        if (data.success) finalUrls.push(data.data.url);
                    } catch (e) { console.error(e); }
                } else if (img.startsWith('data:image')) {
                    try {
                        const cleanBase64 = img.replace(/^data:image\/[a-zA-Z0-9\+\/]+;base64,/, "");
                        const formData = new FormData();
                        formData.append('image', cleanBase64);
                        const res = await fetch('https://api.imgbb.com/1/upload?key=' + IMGBB_API_KEY, { method: 'POST', body: formData });
                        const data = await res.json();
                        if (data.success) finalUrls.push(data.data.url);
                    } catch (e) { console.error(e); }
                }
            }

            if (finalUrls.length === 0) {
                alert("Image upload failed. Try pasting direct Image URL!");
                submitBtn.disabled = false;
                submitBtn.innerHTML = 'Add Product';
                return;
            }

            const productData = { title, price, description: description || 'Premium Product', category, images: finalUrls, sizes, colors };

            let res;
            if (editId) res = await supabase.from('products').update(productData).eq('id', editId);
            else res = await supabase.from('products').insert([productData]);

            if (!res.error) {
                showToast('✅ Product Live!');
                clearForm();
                await loadProducts();
                updateStats();
            } else {
                alert("Database Error: " + res.error.message);
            }

            submitBtn.disabled = false;
            submitBtn.innerHTML = 'Add Product';
        }

        function clearForm() {
            document.getElementById('p-title').value = '';
            document.getElementById('p-price').value = '';
            document.getElementById('p-description').value = '';
            document.getElementById('p-category').value = '';
            document.getElementById('edit-id').value = '';
            imageList = []; rawFiles = []; sizes = []; colors = []; editId = null;
            renderPreviews(); renderOptions('size'); renderOptions('color');
        }

        async function addCategory() {
            const name = document.getElementById('new-cat-name').value.trim();
            if (!name) return;
            await supabase.from('categories').insert([{ name }]);
            document.getElementById('new-cat-name').value = '';
            await loadCategories(); updateStats();
        }

        async function deleteCategory(id) {
            if (confirm('Delete?')) { await supabase.from('categories').delete().eq('id', id); await loadCategories(); updateStats(); }
        }

        async function deleteProduct(id) {
            if (confirm('Delete?')) { await supabase.from('products').delete().eq('id', id); await loadProducts(); updateStats(); }
        }

        function editProduct(id) {
            const p = productsList.find(x => x.id == id);
            if (!p) return;
            editId = id;
            document.getElementById('p-title').value = p.title || '';
            document.getElementById('p-price').value = p.price || '';
            document.getElementById('p-description').value = p.description || '';
            document.getElementById('p-category').value = p.category || '';
            imageList = p.images ? [...p.images] : [];
            rawFiles = new Array(imageList.length).fill(null);
            sizes = p.sizes || []; colors = p.colors || [];
            renderPreviews(); renderOptions('size'); renderOptions('color');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function autoDetectCategory() {
            const title = document.getElementById('p-title').value.toLowerCase();
            if (title.includes('watch')) document.getElementById('p-category').value = 'Watches';
            else if (title.includes('shirt') || title.includes('dress')) document.getElementById('p-category').value = 'Clothing';
        }

        async function updateOrderStatus(id, status) {
            await supabase.from('orders').update({ status }).eq('id', id);
            await loadOrders();
        }

        function renderCategories() {
            document.getElementById('categories-list').innerHTML = categoriesList.map(c => `
                <span class="category-tag">${c.name}<button class="remove" onclick="deleteCategory('${c.id}')">×</button></span>
            `).join('');
        }

        function renderProducts() {
            document.getElementById('products-list').innerHTML = productsList.map(p => `
                <div class="product-item">
                    <div class="info">
                        <img src="${p.images?.[0] || 'https://via.placeholder.com/40'}" />
                        <div><div class="title">${p.title}</div><div class="meta">Rs. ${p.price}</div></div>
                    </div>
                    <div>
                        <button class="btn-edit" onclick="editProduct('${p.id}')">Edit</button>
                        <button class="btn-danger-sm" onclick="deleteProduct('${p.id}')">Del</button>
                    </div>
                </div>
            `).join('');
        }

        function renderOrders() {
            document.getElementById('order-list').innerHTML = ordersList.map(o => `
                <div class="order-item">
                    <div class="order-info"><span class="order-id">#${o.order_id || o.id}</span><span class="order-meta">${o.name} • Rs. ${o.total}</span></div>
                    <select onchange="updateOrderStatus('${o.id}', this.value)">
                        <option value="processing" ${o.status === 'processing' ? 'selected' : ''}>Processing</option>
                        <option value="shipped" ${o.status === 'shipped' ? 'selected' : ''}>Shipped</option>
                        <option value="delivered" ${o.status === 'delivered' ? 'selected' : ''}>Delivered</option>
                    </select>
                </div>
            `).join('');
        }

        function updateStats() {
            document.getElementById('total-products').textContent = productsList.length;
            document.getElementById('total-categories').textContent = categoriesList.length;
            document.getElementById('total-orders').textContent = ordersList.length;
            document.getElementById('product-count').textContent = productsList.length;
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-msg').textContent = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }
    </script>
</body>
</html>
