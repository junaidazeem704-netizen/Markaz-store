<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Track Order - Markaz Store</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <style>
        /* Tracking page styles - same as before */
        .tracking-page {
            padding: 100px 24px 60px;
            min-height: 100vh;
        }
        .tracking-page .container {
            max-width: 600px;
            margin: 0 auto;
        }
        .tracking-card {
            background: var(--bg-card);
            border: var(--border);
            border-radius: var(--radius-lg);
            padding: 40px;
            text-align: center;
        }
        .tracking-card .icon {
            font-size: 3rem;
            color: var(--accent);
            margin-bottom: 16px;
        }
        .tracking-card h1 {
            font-size: 1.8rem;
            font-weight: 800;
            margin-bottom: 8px;
        }
        .tracking-card p {
            color: var(--text-secondary);
            margin-bottom: 24px;
        }
        .tracking-input-group {
            display: flex;
            gap: 12px;
        }
        .tracking-input-group input {
            flex: 1;
            padding: 14px 18px;
            background: var(--bg-primary);
            border: var(--border);
            border-radius: var(--radius-sm);
            color: var(--text-primary);
            font-size: 1rem;
            outline: none;
        }
        .tracking-input-group input:focus {
            border-color: var(--accent);
        }
        .tracking-input-group button {
            padding: 14px 28px;
        }
        .order-details {
            margin-top: 24px;
            background: var(--bg-primary);
            border-radius: var(--radius-md);
            padding: 20px;
            border: var(--border);
            text-align: left;
            display: none;
        }
        .order-status-badge {
            padding: 4px 16px;
            border-radius: 100px;
            font-size: 0.75rem;
            font-weight: 600;
        }
        .order-status-badge.processing { background: rgba(245,158,11,0.15); color: #f59e0b; }
        .order-status-badge.shipped { background: rgba(99,102,241,0.15); color: #6366f1; }
        .order-status-badge.delivered { background: rgba(16,185,129,0.15); color: #10b981; }
        .order-status-badge.cancelled { background: rgba(239,68,68,0.15); color: #ef4444; }
        .detail-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .detail-row:last-child { border-bottom: none; }
        .detail-row .label { color: var(--text-secondary); }
        .detail-row .value { font-weight: 500; text-align: right; }
        .error-message {
            color: var(--danger);
            margin-top: 12px;
            display: none;
        }
        .toast {
            position: fixed;
            bottom: 20px;
            left: 16px;
            right: 16px;
            background: rgba(26,26,46,0.95);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 12px;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 9999;
            transform: translateY(120px);
            opacity: 0;
            transition: all 0.4s ease;
        }
        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }
        .toast-icon { width: 28px; height: 28px; border-radius: 50%; background: rgba(16,185,129,0.12); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .toast-icon i { color: #10b981; font-size: 0.9rem; }
        .toast.error .toast-icon { background: rgba(239,68,68,0.12); }
        .toast.error .toast-icon i { color: #ef4444; }
        .toast-content { flex: 1; }
        .toast-title { font-size: 0.75rem; font-weight: 600; }
        .toast-message { font-size: 0.7rem; color: #a0a0b8; }
        .toast-close { background: none; border: none; color: #6a6a82; cursor: pointer; font-size: 1rem; }
        @media (max-width: 480px) {
            .tracking-input-group { flex-direction: column; }
            .tracking-card { padding: 24px; }
        }
    </style>
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-left">
                <div class="logo"><i class="fas fa-store-alt"></i><span>Markaz</span></div>
                <div class="nav-links">
                    <a href="index.html">Home</a>
                    <a href="products.html">Products</a>
                    <a href="index.html#about">About</a>
                    <a href="contact.html">Contact</a>
                </div>
            </div>
            <div class="nav-right">
                <button class="nav-btn" onclick="window.location.href='admin.html'"><i class="fas fa-cog"></i><span>Admin</span></button>
                <button class="nav-btn" onclick="window.location.href='tracking.html'"><i class="fas fa-search"></i><span>Track</span></button>
                <button class="nav-btn cart-btn" onclick="window.location.href='cart.html'"><i class="fas fa-shopping-bag"></i><span class="cart-badge" id="cart-badge">0</span></button>
            </div>
        </div>
    </nav>

    <section class="tracking-page">
        <div class="container">
            <div class="tracking-card">
                <div class="icon"><i class="fas fa-box"></i></div>
                <h1>Track Your Order</h1>
                <p>Enter your Order ID to track your order status</p>

                <div class="tracking-input-group">
                    <input type="text" id="order-id-input" placeholder="e.g. MK-123456" />
                    <button class="btn-primary" onclick="trackOrder()"><i class="fas fa-search"></i> Track</button>
                </div>

                <div class="error-message" id="error-message">
                    <i class="fas fa-exclamation-circle"></i>
                    <span id="error-text">Order not found</span>
                </div>

                <div class="order-details" id="order-details">
                    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:8px;">
                        <span style="font-weight:600;">Order #<span id="track-order-id">-</span></span>
                        <span class="order-status-badge" id="track-status">Processing</span>
                    </div>
                    <div class="detail-row"><span class="label">Items</span><span class="value" id="track-items">-</span></div>
                    <div class="detail-row"><span class="label">Total</span><span class="value" id="track-total">-</span></div>
                    <div class="detail-row"><span class="label">Date</span><span class="value" id="track-date">-</span></div>
                    <div class="detail-row"><span class="label">Address</span><span class="value" id="track-address">-</span></div>
                    <div class="detail-row"><span class="label">Color</span><span class="value" id="track-color">-</span></div>
                    <div class="detail-row"><span class="label">Size</span><span class="value" id="track-size">-</span></div>
                </div>
            </div>
        </div>
    </section>

    <!-- Toast -->
    <div class="toast" id="toast">
        <div class="toast-icon"><i class="fas fa-check-circle"></i></div>
        <div class="toast-content">
            <span class="toast-title">Success!</span>
            <span class="toast-message" id="toast-msg">Done</span>
        </div>
        <button class="toast-close" onclick="this.parentElement.classList.remove('show')"><i class="fas fa-times"></i></button>
    </div>

    <script>
        // ============================================
        // TRACK ORDER - FROM LOCALSTORAGE
        // ============================================
        function trackOrder() {
            const orderId = document.getElementById('order-id-input').value.trim();
            const errorMsg = document.getElementById('error-message');
            const details = document.getElementById('order-details');

            errorMsg.style.display = 'none';
            details.style.display = 'none';

            if (!orderId) {
                errorMsg.style.display = 'block';
                document.getElementById('error-text').textContent = 'Please enter an Order ID';
                return;
            }

            const orders = JSON.parse(localStorage.getItem('orders') || '[]');
            const order = orders.find(o => o.orderId === orderId);

            if (order) {
                displayOrderDetails(order);
                details.style.display = 'block';
                showToast('✅ Order found!', 'success');
            } else {
                errorMsg.style.display = 'block';
                document.getElementById('error-text').textContent = 'Order not found. Please check your Order ID.';
                showToast('❌ Order not found!', 'error');
            }
        }

        function displayOrderDetails(order) {
            document.getElementById('track-order-id').textContent = order.orderId;

            const status = order.status || 'processing';
            const statusBadge = document.getElementById('track-status');
            statusBadge.textContent = status.charAt(0).toUpperCase() + status.slice(1);
            statusBadge.className = 'order-status-badge ' + status;

            document.getElementById('track-items').textContent = order.items || 'N/A';
            document.getElementById('track-total').textContent = `Rs. ${order.total || 0}`;
            document.getElementById('track-date').textContent = order.createdAt ? new Date(order.createdAt).toLocaleDateString() : 'N/A';
            document.getElementById('track-address').textContent = order.address || 'N/A';
            document.getElementById('track-color').textContent = order.colors || 'N/A';
            document.getElementById('track-size').textContent = order.sizes || 'N/A';
        }

        // Check URL for order ID
        document.addEventListener('DOMContentLoaded', function() {
            const params = new URLSearchParams(window.location.search);
            const orderId = params.get('id');
            if (orderId) {
                document.getElementById('order-id-input').value = orderId;
                trackOrder();
            }
            updateCartBadge();
        });

        function updateCartBadge() {
            const cart = JSON.parse(localStorage.getItem('cart') || '[]');
            const badge = document.getElementById('cart-badge');
            if (badge) badge.textContent = cart.length;
        }

        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            if (!toast) { alert(message); return; }
            document.getElementById('toast-msg').textContent = message;
            const titles = { success: '✅ Success!', error: '❌ Error!', warning: '⚠️ Warning', info: 'ℹ️ Info' };
            toast.querySelector('.toast-title').textContent = titles[type] || titles.success;
            toast.className = 'toast';
            if (type) toast.classList.add(type);
            toast.classList.add('show');
            clearTimeout(toast._timeout);
            toast._timeout = setTimeout(() => toast.classList.remove('show'), 3000);
        }

        window.trackOrder = trackOrder;
    </script>
</body>
</html>
