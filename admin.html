<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Markaz Store</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .admin-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .card { background: var(--bg-card); padding: 20px; border-radius: 12px; border: 1px solid var(--border); margin-bottom: 20px; }
        .form-control { width: 100%; padding: 10px; background: var(--bg-main); border: 1px solid var(--border); color: #fff; border-radius: 8px; margin-bottom: 12px; }
        @media(max-width:768px) { .admin-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="container nav-flex">
            <a href="index.html" class="logo"><i class="fas fa-cog"></i> MARKAZ <span>ADMIN</span></a>
            <a href="index.html" class="btn btn-outline"><i class="fas fa-store"></i> View Store</a>
        </div>
    </nav>

    <div class="container" style="margin-top:30px;">
        <div class="admin-grid">
            <!-- Add / Edit Product -->
            <div class="card">
                <h3><i class="fas fa-plus-circle"></i> Add / Edit Product</h3>
                <form id="product-form" onsubmit="saveProduct(event)" style="margin-top:14px;">
                    <input type="text" id="p-title" class="form-control" placeholder="Product Title *" required>
                    <input type="number" id="p-price" class="form-control" placeholder="Price (PKR) *" required>
                    <textarea id="p-desc" class="form-control" placeholder="Product Description"></textarea>
                    <input type="text" id="p-cat" class="form-control" placeholder="Category (e.g. Watches, Shirts)">

                    <!-- Multi Image Input + Auto Detection -->
                    <label style="font-size:0.8rem; color:var(--text-muted);">Upload Images (ImgBB):</label>
                    <input type="file" id="p-images" class="form-control" accept="image/*" multiple onchange="handleImageSelection(event)">
                    <div id="img-preview" style="display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px;"></div>

                    <div style="display:flex; gap:8px; margin-bottom:12px;">
                        <input type="text" id="p-colors" class="form-control" placeholder="Colors (Comma separated)" style="margin-bottom:0;">
                        <button type="button" class="btn btn-outline" onclick="autoDetectColors()"><i class="fas fa-magic"></i> Auto Color</button>
                    </div>

                    <input type="text" id="p-sizes" class="form-control" placeholder="Sizes (e.g. S, M, L, XL)">

                    <button type="submit" id="save-p-btn" class="btn btn-primary" style="width:100%;">Save Product to Database</button>
                </form>
            </div>

            <!-- Banner Control Panel -->
            <div class="card">
                <h3><i class="fas fa-sliders-h"></i> Homepage Store Settings</h3>
                <form onsubmit="saveSettings(event)" style="margin-top:14px;">
                    <label style="font-size:0.8rem;">Banner Main Heading:</label>
                    <input type="text" id="s-title" class="form-control">
                    <label style="font-size:0.8rem;">Banner Subtitle:</label>
                    <input type="text" id="s-subtitle" class="form-control">
                    <label style="font-size:0.8rem;">Banner Image URL:</label>
                    <input type="text" id="s-image" class="form-control">
                    <button type="submit" class="btn btn-primary" style="width:100%;">Update Store Banners</button>
                </form>
            </div>
        </div>

        <!-- Orders Table -->
        <div class="card">
            <h3><i class="fas fa-truck"></i> Live Orders & Status Email Manager</h3>
            <div id="orders-list" style="margin-top:14px; overflow-x:auto;"></div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://vnzipnxrasonkhlwcynq.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZuemlwbnhyYXNvbmtobHdjeW5xIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDA5MjY0ODcsImV4cCI6MjA1NjUwMjQ4N30.KfgUQ-fn1L0A_Jv3pFESuC8jR1R7S_iC9RPNlWpTbJ0';
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        const IMGBB_API_KEY = '311cba478ef03480a9e99f45226dc6ac';

        let selectedFiles = [];

        document.addEventListener('DOMContentLoaded', async () => {
            await loadOrders();
            await loadSettingsData();
        });

        function handleImageSelection(e) {
            selectedFiles = Array.from(e.target.files);
            const preview = document.getElementById('img-preview');
            preview.innerHTML = selectedFiles.map(f => `<img src="${URL.createObjectURL(f)}" width="50" height="50" style="object-fit:cover; border-radius:6px;">`).join('');
        }

        function autoDetectColors() {
            const title = document.getElementById('p-title').value.toLowerCase();
            const colorMap = ['black', 'white', 'red', 'blue', 'green', 'yellow', 'silver', 'gold', 'navy', 'grey'];
            const detected = colorMap.filter(c => title.includes(c));
            if (detected.length) {
                document.getElementById('p-colors').value = detected.join(', ');
                alert(`✨ Auto Detected Colors: ${detected.join(', ')}`);
            } else {
                alert('No standard color name found in title. Type manually.');
            }
        }

        async function saveProduct(e) {
            e.preventDefault();
            const btn = document.getElementById('save-p-btn');
            btn.disabled = true;
            btn.innerText = 'Uploading Images to ImgBB...';

            let imageUrls = [];

            // ImgBB Upload Loop
            for (let file of selectedFiles) {
                const formData = new FormData();
                formData.append('image', file);
                try {
                    const res = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, { method: 'POST', body: formData });
                    const json = await res.json();
                    if (json.success) imageUrls.push(json.data.url);
                } catch(err) { console.error('Image upload failed', err); }
            }

            btn.innerText = 'Saving to Database...';

            const payload = {
                title: document.getElementById('p-title').value.trim(),
                price: parseFloat(document.getElementById('p-price').value),
                description: document.getElementById('p-desc').value.trim(),
                category: document.getElementById('p-category')?.value || 'General',
                images: imageUrls.length ? imageUrls : ['https://via.placeholder.com/300'],
                colors: document.getElementById('p-colors').value.split(',').map(s => s.trim()).filter(Boolean),
                sizes: document.getElementById('p-sizes').value.split(',').map(s => s.trim()).filter(Boolean)
            };

            const { error } = await supabase.from('products').insert([payload]);

            if (!error) {
                alert('✅ Product successfully added!');
                location.reload();
            } else {
                alert('Error: ' + error.message);
                btn.disabled = false;
                btn.innerText = 'Save Product to Database';
            }
        }

        async function loadOrders() {
            const { data } = await supabase.from('orders').select('*').order('created_at', { ascending: false });
            const div = document.getElementById('orders-list');
            if (data && data.length) {
                div.innerHTML = `
                    <table style="width:100%; border-collapse:collapse; font-size:0.85rem;">
                        <tr style="background:var(--bg-main); text-align:left;">
                            <th style="padding:10px;">ID</th>
                            <th>Customer</th>
                            <th>Total</th>
                            <th>Status</th>
                            <th>Action</th>
                        </tr>
                        ${data.map(o => `
                            <tr style="border-bottom:1px solid var(--border);">
                                <td style="padding:10px;">${o.order_id}</td>
                                <td>${o.name}<br><small>${o.phone}</small></td>
                                <td>Rs. ${o.total}</td>
                                <td><span style="color:var(--primary); font-weight:700;">${o.status}</span></td>
                                <td>
                                    <select onchange="updateOrderStatus('${o.id}', this.value)" style="padding:4px; background:var(--bg-main); color:#fff; border-radius:4px;">
                                        <option value="processing" ${o.status==='processing'?'selected':''}>Processing</option>
                                        <option value="shipped" ${o.status==='shipped'?'selected':''}>Shipped</option>
                                        <option value="delivered" ${o.status==='delivered'?'selected':''}>Delivered</option>
                                        <option value="cancelled" ${o.status==='cancelled'?'selected':''}>Cancelled</option>
                                    </select>
                                </td>
                            </tr>
                        `).join('')}
                    </table>
                `;
            }
        }

        async function updateOrderStatus(id, newStatus) {
            const { data, error } = await supabase.from('orders').update({ status: newStatus }).eq('id', id).select().single();
            if (!error && data) {
                // Send Status Change Mail
                await fetch('/api/send-email', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ type: 'STATUS_UPDATE', order: data })
                });
                alert('✅ Order status updated & email sent to customer!');
                await loadOrders();
            }
        }

        async function loadSettingsData() {
            const { data } = await supabase.from('settings').select('*').eq('id', 1).single();
            if (data) {
                document.getElementById('s-title').value = data.banner_title;
                document.getElementById('s-subtitle').value = data.banner_subtitle;
                document.getElementById('s-image').value = data.banner_image;
            }
        }

        async function saveSettings(e) {
            e.preventDefault();
            const payload = {
                banner_title: document.getElementById('s-title').value,
                banner_subtitle: document.getElementById('s-subtitle').value,
                banner_image: document.getElementById('s-image').value
            };
            await supabase.from('settings').update(payload).eq('id', 1);
            alert('✅ Homepage Settings Saved!');
        }
    </script>
</body>
</html>
