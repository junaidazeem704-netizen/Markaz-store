<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Panel - Markaz Store</title>
    <link rel="stylesheet" href="style.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <style>
        /* Admin Styles */
        .admin-wrapper {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }
        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 30px;
            background: var(--bg-card);
            border: var(--border);
            border-radius: var(--radius-lg);
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 15px;
        }
        .admin-header h1 {
            font-size: 1.8rem;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .admin-header h1 i {
            color: var(--accent);
        }
        .admin-header-actions {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }
        .admin-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .admin-stat-card {
            background: var(--bg-card);
            border: var(--border);
            border-radius: var(--radius-md);
            padding: 20px 24px;
            transition: var(--transition);
        }
        .admin-stat-card:hover {
            border-color: var(--accent);
            transform: translateY(-2px);
        }
        .admin-stat-card .label {
            font-size: 0.8rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .admin-stat-card .value {
            font-size: 2rem;
            font-weight: 700;
            margin-top: 4px;
            color: var(--accent);
        }
        .admin-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
        }
        .admin-card {
            background: var(--bg-card);
            border: var(--border);
            border-radius: var(--radius-lg);
            padding: 24px 28px;
        }
        .admin-card.full {
            grid-column: 1 / -1;
        }
        .admin-card h2 {
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .admin-card h2 i {
            color: var(--accent);
        }
        .admin-card .badge {
            background: var(--accent);
            color: white;
            font-size: 0.7rem;
            padding: 2px 12px;
            border-radius: 100px;
            margin-left: 8px;
        }
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 16px;
        }
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .form-group label {
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-secondary);
        }
        .form-group label .required {
            color: var(--danger);
        }
        .form-group input,
        .form-group select,
        .form-group textarea {
            padding: 12px 16px;
            background: var(--bg-primary);
            border: var(--border);
            border-radius: var(--radius-sm);
            color: var(--text-primary);
            font-size: 0.95rem;
            font-family: inherit;
            transition: var(--transition);
            outline: none;
            width: 100%;
        }
        .form-group input:focus,
        .form-group select:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }
        .form-group input::placeholder {
            color: var(--text-muted);
        }
        .form-group small {
            font-size: 0.75rem;
            color: var(--text-muted);
        }
        .form-group small i {
            color: var(--accent);
        }
        .form-actions {
            display: flex;
            gap: 12px;
            margin-top: 8px;
            flex-wrap: wrap;
        }
        .btn-primary {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 28px;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(99, 102, 241, 0.3);
        }
        .btn-secondary {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 28px;
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--admin-border);
            border-radius: 10px;
            color: var(--text-secondary);
            font-size: 0.95rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
        }
        .btn-secondary:hover {
            background: rgba(255,255,255,0.1);
            color: var(--text-primary);
        }
        .btn-danger {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.2);
            border-radius: 10px;
            color: var(--danger);
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
        }
        .btn-danger:hover {
            background: rgba(239, 68, 68, 0.25);
        }
        .btn-sm {
            padding: 8px 16px;
            font-size: 0.8rem;
        }
        /* Image Upload */
        .image-upload-area {
            border: 2px dashed rgba(255,255,255,0.1);
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
        }
        .image-upload-area:hover {
            border-color: var(--accent);
        }
        .image-upload-area input[type="file"] {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            opacity: 0;
            cursor: pointer;
        }
        .image-upload-area i {
            font-size: 2rem;
            color: var(--accent);
            display: block;
            margin-bottom: 8px;
        }
        .image-upload-area p {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }
        .image-upload-area .sub {
            color: var(--text-muted);
            font-size: 0.75rem;
        }
        .image-preview-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
            gap: 12px;
            margin-top: 12px;
        }
        .image-preview-item {
            position: relative;
            border-radius: 8px;
            overflow: hidden;
            aspect-ratio: 1;
            background: rgba(255,255,255,0.04);
            border: 1px solid var(--admin-border);
        }
        .image-preview-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .image-preview-item .remove-img {
            position: absolute;
            top: 4px;
            right: 4px;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: rgba(0,0,0,0.7);
            border: none;
            color: white;
            cursor: pointer;
            font-size: 0.7rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }
        .image-preview-item .remove-img:hover {
            background: var(--danger);
        }
        /* Options */
        .options-group {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 4px;
            min-height: 36px;
        }
        .option-tag {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 4px 12px 4px 16px;
            background: rgba(255,255,255,0.06);
            border: 1px solid var(--admin-border);
            border-radius: 100px;
            font-size: 0.85rem;
        }
        .option-tag .remove {
            cursor: pointer;
            color: var(--danger);
            background: none;
            border: none;
            font-size: 1rem;
            transition: all 0.3s ease;
        }
        .option-tag .remove:hover {
            transform: scale(1.2);
        }
        .option-input-row {
            display: flex;
            gap: 8px;
            margin-top: 8px;
        }
        .option-input-row input {
            flex: 1;
            padding: 8px 14px;
            background: rgba(255,255,255,0.04);
            border: 1px solid var(--admin-border);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 0.9rem;
            font-family: inherit;
            outline: none;
        }
        .option-input-row input:focus {
            border-color: var(--accent);
        }
        /* Category Tags */
        .category-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 4px;
        }
        .category-tag {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 14px 6px 18px;
            background: rgba(255,255,255,0.06);
            border: 1px solid var(--admin-border);
            border-radius: 100px;
            font-size: 0.85rem;
        }
        .category-tag .remove {
            cursor: pointer;
            color: var(--danger);
            background: none;
            border: none;
            font-size: 1rem;
            transition: all 0.3s ease;
        }
        .category-tag .remove:hover {
            transform: scale(1.2);
        }
        .category-input-row {
            display: flex;
            gap: 12px;
            margin-bottom: 16px;
        }
        .category-input-row .suggestions-container {
            flex: 1;
        }
        /* Product List */
        .product-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 400px;
            overflow-y: auto;
        }
        .product-list::-webkit-scrollbar {
            width: 4px;
        }
        .product-list::-webkit-scrollbar-track {
            background: transparent;
        }
        .product-list::-webkit-scrollbar-thumb {
            background: var(--accent);
            border-radius: 10px;
        }
        .product-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background: rgba(255,255,255,0.03);
            border-radius: 10px;
            border: 1px solid var(--admin-border);
            transition: all 0.3s ease;
            flex-wrap: wrap;
            gap: 10px;
        }
        .product-item:hover {
            border-color: rgba(255,255,255,0.1);
        }
        .product-item .info {
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .product-item .info img {
            width: 48px;
            height: 48px;
            object-fit: cover;
            border-radius: 8px;
            background: rgba(255,255,255,0.04);
        }
        .product-item .info .title {
            font-weight: 500;
            font-size: 0.95rem;
        }
        .product-item .info .category {
            font-size: 0.75rem;
            color: var(--text-secondary);
        }
        .product-item .actions {
            display: flex;
            gap: 8px;
        }
        .product-item .actions .btn-danger {
            padding: 6px 14px;
            font-size: 0.75rem;
        }
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-muted);
            display: none;
        }
        .empty-state i {
            font-size: 2.4rem;
            display: block;
            margin-bottom: 12px;
        }
        .product-list-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 4px 12px;
            border-bottom: 1px solid var(--admin-border);
            margin-bottom: 8px;
        }
        .product-list-header span {
            font-size: 0.85rem;
            color: var(--text-secondary);
        }
        .product-count {
            background: var(--accent);
            color: white;
            padding: 2px 12px;
            border-radius: 100px;
            font-size: 0.75rem;
            font-weight: 600;
        }
        /* Suggestions */
        .suggestions-container {
            position: relative;
            width: 100%;
        }
        .suggestions-dropdown {
            position: absolute;
            top: calc(100% + 4px);
            left: 0;
            right: 0;
            background: var(--bg-card);
            border: var(--border);
            border-radius: 10px;
            max-height: 180px;
            overflow-y: auto;
            display: none;
            z-index: 100;
            box-shadow: var(--shadow-md);
        }
        .suggestions-dropdown::-webkit-scrollbar {
            width: 4px;
        }
        .suggestions-dropdown::-webkit-scrollbar-track {
            background: transparent;
        }
        .suggestions-dropdown::-webkit-scrollbar-thumb {
            background: var(--accent);
            border-radius: 10px;
        }
        .suggestion-item {
            padding: 10px 16px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 0.9rem;
            border-bottom: 1px solid rgba(255,255,255,0.04);
        }
        .suggestion-item:hover {
            background: rgba(255,255,255,0.06);
        }
        .suggestion-item.new-category {
            color: var(--accent);
            font-weight: 500;
        }
        /* Toast */
        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: var(--bg-card);
            border: var(--border);
            border-radius: 12px;
            padding: 16px 20px;
            display: flex;
            align-items: center;
            gap: 14px;
            box-shadow: var(--shadow-lg);
            z-index: 9999;
            transform: translateY(120px);
            opacity: 0;
            transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            max-width: 420px;
        }
        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }
        .toast-icon {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: rgba(16, 185, 129, 0.12);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .toast-icon i {
            color: var(--success);
            font-size: 1.2rem;
        }
        .toast.error .toast-icon {
            background: rgba(239, 68, 68, 0.12);
        }
        .toast.error .toast-icon i {
            color: var(--danger);
        }
        .toast-content {
            display: flex;
            flex-direction: column;
            flex: 1;
        }
        .toast-title {
            font-size: 0.85rem;
            font-weight: 600;
        }
        .toast-message {
            font-size: 0.8rem;
            color: var(--text-secondary);
        }
        .toast-close {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 4px;
            transition: all 0.3s ease;
        }
        .toast-close:hover {
            color: var(--text-primary);
        }
        @media (max-width: 1024px) {
            .admin-grid {
                grid-template-columns: 1fr;
            }
        }
        @media (max-width: 768px) {
            body {
                padding: 12px;
            }
            .admin-header {
                flex-direction: column;
                text-align: center;
                padding: 16px 20px;
            }
            .admin-header-actions {
                justify-content: center;
            }
            .form-row {
                grid-template-columns: 1fr;
            }
            .admin-card {
                padding: 16px 18px;
            }
            .admin-stats {
                grid-template-columns: 1fr 1fr;
            }
            .product-item {
                flex-direction: column;
                align-items: stretch;
            }
            .product-item .actions {
                justify-content: flex-end;
            }
            .toast {
                bottom: 16px;
                right: 16px;
                left: 16px;
                max-width: 100%;
            }
        }
        @media (max-width: 480px) {
            .admin-stats {
                grid-template-columns: 1fr;
            }
            .admin-header h1 {
                font-size: 1.2rem;
            }
        }
    </style>
</head>
<body>

    <div class="admin-wrapper">
        <!-- Header -->
        <header class="admin-header">
            <h1>
                <i class="fas fa-crown"></i>
                Store Management
            </h1>
            <div class="admin-header-actions">
                <a href="index.html" class="btn-secondary btn-sm">
                    <i class="fas fa-store"></i> View Store
                </a>
                <button class="btn-danger btn-sm" onclick="resetStorage()">
                    <i class="fas fa-trash-alt"></i> Reset Data
                </button>
            </div>
        </header>

        <!-- Stats -->
        <div class="admin-stats">
            <div class="admin-stat-card">
                <div class="label">📦 Total Products</div>
                <div class="value" id="total-products">0</div>
            </div>
            <div class="admin-stat-card">
                <div class="label">🏷️ Categories</div>
                <div class="value" id="total-categories">0</div>
            </div>
            <div class="admin-stat-card">
                <div class="label">📊 Orders</div>
                <div class="value" id="total-orders">0</div>
            </div>
            <div class="admin-stat-card">
                <div class="label">👥 Customers</div>
                <div class="value" id="total-customers">0</div>
            </div>
        </div>

        <!-- Admin Grid -->
        <div class="admin-grid">
            <!-- Add Product - Full Width -->
            <div class="admin-card full">
                <h2><i class="fas fa-plus-circle"></i> Add New Product</h2>
                
                <div class="form-row">
                    <div class="form-group">
                        <label>Product Title <span class="required">*</span></label>
                        <input type="text" id="p-title" placeholder="e.g. Premium Smart Watch" />
                    </div>
                    <div class="form-group">
                        <label>Price (PKR) <span class="required">*</span></label>
                        <input type="number" id="p-price" placeholder="e.g. 2500" />
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Category <span class="required">*</span></label>
                        <div class="suggestions-container">
                            <input type="text" id="p-category-input" placeholder="Type or auto-detect" />
                            <div class="suggestions-dropdown" id="category-suggestions-product"></div>
                        </div>
                        <input type="hidden" id="p-category" />
                        <small>
                            <i class="fas fa-magic"></i> Auto-detects from product title
                        </small>
                    </div>
                    <div class="form-group">
                        <label>Multiple Images <span class="required">*</span></label>
                        <div class="image-upload-area">
                            <i class="fas fa-cloud-upload-alt"></i>
                            <p>Click to upload images</p>
                            <span class="sub">PNG, JPG, WEBP (Max 5 images)</span>
                            <input type="file" id="p-images" accept="image/*" multiple />
                        </div>
                        <div class="image-preview-grid" id="image-preview-grid"></div>
                        <input type="hidden" id="p-images-data" value="[]" />
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label><i class="fas fa-ruler"></i> Sizes (Clothing)</label>
                        <div class="options-group" id="sizes-container"></div>
                        <div class="option-input-row">
                            <input type="text" id="size-input" placeholder="e.g. S, M, L, XL" />
                            <button class="btn-secondary btn-sm" onclick="addOption('size')">
                                <i class="fas fa-plus"></i> Add
                            </button>
                        </div>
                        <input type="hidden" id="p-sizes" value="[]" />
                    </div>
                    <div class="form-group">
                        <label><i class="fas fa-palette"></i> Colors</label>
                        <div class="options-group" id="colors-container"></div>
                        <div class="option-input-row">
                            <input type="text" id="color-input" placeholder="e.g. Black, White, Blue" />
                            <button class="btn-secondary btn-sm" onclick="addOption('color')">
                                <i class="fas fa-plus"></i> Add
                            </button>
                        </div>
                        <input type="hidden" id="p-colors" value="[]" />
                    </div>
                </div>

                <div class="form-actions">
                    <button class="btn-primary" onclick="addProduct()">
                        <i class="fas fa-plus"></i> Add Product
                    </button>
                    <button class="btn-secondary" onclick="addProductSmart()">
                        <i class="fas fa-magic"></i> Auto-Detect
                    </button>
                </div>
            </div>

            <!-- Categories -->
            <div class="admin-card">
                <h2><i class="fas fa-tags"></i> Categories</h2>
                <div class="category-input-row">
                    <div class="suggestions-container">
                        <input type="text" id="new-cat-name" placeholder="New category..." />
                        <div class="suggestions-dropdown" id="category-suggestions"></div>
                    </div>
                    <button class="btn-primary btn-sm" onclick="addCategory()">
                        <i class="fas fa-plus"></i> Add
                    </button>
                </div>
                <div class="category-tags" id="categories-list"></div>
            </div>

            <!-- Products List -->
            <div class="admin-card">
                <h2>
                    <i class="fas fa-box"></i> All Products
                    <span class="badge" id="product-count">0</span>
                </h2>
                <div class="product-list-header">
                    <span><i class="fas fa-list"></i> Product List</span>
                    <span class="product-count" id="product-count-badge">0</span>
                </div>
                <div class="product-list" id="admin-products-list"></div>
                <div class="empty-state" id="empty-products">
                    <i class="fas fa-box-open"></i>
                    No products added yet
                </div>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast">
        <div class="toast-icon">
            <i class="fas fa-check-circle"></i>
        </div>
        <div class="toast-content">
            <span class="toast-title">Success!</span>
            <span class="toast-message" id="toast-message">Product added successfully</span>
        </div>
        <button class="toast-close" onclick="this.parentElement.classList.remove('show')">
            <i class="fas fa-times"></i>
        </button>
    </div>

    <script src="script.js"></script>
    <script>
        // ============================================
        // ADMIN PANEL - COMPLETE SCRIPT
        // ============================================
        
        let uploadedImages = [];
        let sizes = [];
        let colors = [];

        document.addEventListener('DOMContentLoaded', function() {
            renderAdminPanel();
            updateStats();
            setupImageUpload();
            loadSavedOptions();
            setupCategorySuggestions('new-cat-name', 'category-suggestions');
            setupCategorySuggestions('p-category-input', 'category-suggestions-product');
        });

        // ============================================
        // IMAGE UPLOAD
        // ============================================
        function setupImageUpload() {
            const imageInput = document.getElementById('p-images');
            if (!imageInput) return;
            
            imageInput.addEventListener('change', function(e) {
                const files = e.target.files;
                for (let file of files) {
                    if (uploadedImages.length >= 5) {
                        showToast('Maximum 5 images allowed!', 'warning');
                        break;
                    }
                    const reader = new FileReader();
                    reader.onload = function(event) {
                        uploadedImages.push(event.target.result);
                        renderImagePreviews();
                    };
                    reader.readAsDataURL(file);
                }
                e.target.value = '';
            });
        }

        function renderImagePreviews() {
            const grid = document.getElementById('image-preview-grid');
            if (!grid) return;
            
            if (uploadedImages.length === 0) {
                grid.innerHTML = '';
                return;
            }
            
            grid.innerHTML = uploadedImages.map((img, i) => `
                <div class="image-preview-item">
                    <img src="${img}" alt="Product image ${i+1}" />
                    <button class="remove-img" onclick="removeImage(${i})">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
            `).join('');
            
            document.getElementById('p-images-data').value = JSON.stringify(uploadedImages);
        }

        function removeImage(index) {
            uploadedImages.splice(index, 1);
            renderImagePreviews();
        }

        // ============================================
        // SIZE & COLOR OPTIONS
        // ============================================
        function loadSavedOptions() {
            const sizesData = document.getElementById('p-sizes');
            const colorsData = document.getElementById('p-colors');
            
            if (sizesData && sizesData.value) {
                sizes = JSON.parse(sizesData.value);
                renderOptions('size');
            }
            if (colorsData && colorsData.value) {
                colors = JSON.parse(colorsData.value);
                renderOptions('color');
            }
        }

        function addOption(type) {
            const inputId = type === 'size' ? 'size-input' : 'color-input';
            const array = type === 'size' ? sizes : colors;
            const hiddenId = type === 'size' ? 'p-sizes' : 'p-colors';
            
            const input = document.getElementById(inputId);
            if (!input) return;
            
            const value = input.value.trim();
            
            if (!value) {
                showToast('Please enter a value', 'error');
                return;
            }
            
            if (array.includes(value)) {
                showToast('Option already exists', 'warning');
                return;
            }
            
            array.push(value);
            document.getElementById(hiddenId).value = JSON.stringify(array);
            input.value = '';
            renderOptions(type);
        }

        function removeOption(type, index) {
            const array = type === 'size' ? sizes : colors;
            const hiddenId = type === 'size' ? 'p-sizes' : 'p-colors';
            
            array.splice(index, 1);
            document.getElementById(hiddenId).value = JSON.stringify(array);
            renderOptions(type);
        }

        function renderOptions(type) {
            const containerId = type === 'size' ? 'sizes-container' : 'colors-container';
            const array = type === 'size' ? sizes : colors;
            const container = document.getElementById(containerId);
            
            if (!container) return;
            
            if (array.length === 0) {
                container.innerHTML = '';
                return;
            }
            
            container.innerHTML = array.map((item, i) => `
                <span class="option-tag">
                    ${item}
                    <button class="remove" onclick="removeOption('${type}', ${i})">×</button>
                </span>
            `).join('');
        }

        // ============================================
        // ADD PRODUCT - FIXED
        // ============================================
        async function addProduct() {
            const title = document.getElementById('p-title').value.trim();
            const price = document.getElementById('p-price').value.trim();
            let category = document.getElementById('p-category-input').value.trim() || 'General';
            
            if (!title || !price) {
                showToast('Product Title and Price are required!', 'error');
                return;
            }

            // Ensure category exists
            category = ensureCategoryExists(category);

            // Get images from preview
            const imagesData = document.getElementById('p-images-data');
            const uploadedImages = JSON.parse(imagesData.value || '[]');
            
            if (uploadedImages.length === 0) {
                showToast('Please upload at least one image!', 'error');
                return;
            }

            // Upload images to IMGBB
            let imageUrls = [];
            showToast('Uploading images...', 'info');
            
            for (let img of uploadedImages) {
                try {
                    const response = await fetch(img);
                    const blob = await response.blob();
                    const formData = new FormData();
                    formData.append('image', blob);
                    
                    const uploadRes = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, {
                        method: 'POST',
                        body: formData
                    });
                    
                    const result = await uploadRes.json();
                    if (result.success) {
                        imageUrls.push(result.data.url);
                    } else {
                        showToast('Image upload failed: ' + (result.error?.message || 'Unknown error'), 'error');
                        return;
                    }
                } catch (e) {
                    showToast('Image upload error. Check your connection.', 'error');
                    return;
                }
            }

            // Get sizes and colors
            const sizes = JSON.parse(document.getElementById('p-sizes').value || '[]');
            const colors = JSON.parse(document.getElementById('p-colors').value || '[]');

            const product = {
                title: title,
                price: price,
                category: category,
                images: imageUrls,
                sizes: sizes,
                colors: colors,
                createdAt: new Date().toISOString()
            };

            // Add to products array
            products.push(product);

            try {
                localStorage.setItem('myProducts', JSON.stringify(products));
            } catch (e) {
                showToast('Storage full! Delete some products.', 'error');
                products.pop();
                return;
            }

            // Clear form
            document.getElementById('p-title').value = '';
            document.getElementById('p-price').value = '';
            document.getElementById('p-category-input').value = '';
            document.getElementById('p-images-data').value = '[]';
            document.getElementById('p-sizes').value = '[]';
            document.getElementById('p-colors').value = '[]';
            
            // Clear UI
            uploadedImages.length = 0;
            window.sizes = [];
            window.colors = [];
            renderImagePreviews();
            renderOptions('size');
            renderOptions('color');
            
            // Clear file input
            document.getElementById('p-images').value = '';

            // Update UI
            renderAdminPanel();
            updateStats();
            updateHeroStats();
            renderFooterCategories();
            displayProducts(products);

            showToast(`✅ Product "${title}" added in "${category}" category!`, 'success');
        }

        // ============================================
        // ADD PRODUCT WITH AUTO-DETECT
        // ============================================
        async function addProductSmart() {
            const title = document.getElementById('p-title').value.trim();
            const price = document.getElementById('p-price').value.trim();
            
            if (!title || !price) {
                showToast('Product Title and Price are required!', 'error');
                return;
            }
            
            let detectedCategory = detectCategoryFromTitle(title);
            
            if (detectedCategory) {
                detectedCategory = ensureCategoryExists(detectedCategory);
                const input = document.getElementById('p-category-input');
                if (input) {
                    input.value = detectedCategory;
                }
                showToast(`🔍 Category "${detectedCategory}" detected!`, 'info');
            } else {
                showToast('⚠️ No category detected. Please select manually.', 'warning');
                const input = document.getElementById('p-category-input');
                if (input) {
                    input.focus();
                    input.style.borderColor = '#f59e0b';
                    setTimeout(() => {
                        input.style.borderColor = '';
                    }, 3000);
                }
                return;
            }
            
            await addProduct();
        }

        // ============================================
        // RENDER ADMIN PANEL
        // ============================================
        function renderAdminPanel() {
            // Categories list
            const catList = document.getElementById('categories-list');
            if (catList) {
                if (categories.length === 0) {
                    catList.innerHTML = '<p style="color:var(--text-muted);font-size:0.85rem;">No categories yet.</p>';
                } else {
                    catList.innerHTML = categories.map((c, i) => `
                        <span class="category-tag">
                            ${c}
                            <button class="remove" onclick="deleteCategory(${i})">×</button>
                        </span>
                    `).join('');
                }
            }

            // Products list
            const prodList = document.getElementById('admin-products-list');
            const emptyMsg = document.getElementById('empty-products');
            if (prodList) {
                if (products.length === 0) {
                    prodList.innerHTML = '';
                    if (emptyMsg) emptyMsg.style.display = 'block';
                } else {
                    if (emptyMsg) emptyMsg.style.display = 'none';
                    prodList.innerHTML = products.map((p, i) => `
                        <div class="product-item">
                            <div class="info">
                                <img src="${p.images && p.images[0] ? p.images[0] : 'https://via.placeholder.com/45'}" alt="${p.title}" />
                                <div>
                                    <div class="title">${p.title}</div>
                                    <div class="category">
                                        ${p.category || 'General'} • Rs. ${p.price}
                                        ${p.sizes && p.sizes.length > 0 ? ` • Sizes: ${p.sizes.join(', ')}` : ''}
                                        ${p.colors && p.colors.length > 0 ? ` • Colors: ${p.colors.join(', ')}` : ''}
                                    </div>
                                </div>
                            </div>
                            <div class="actions">
                                <button class="btn-danger" onclick="deleteProduct(${i})">
                                    <i class="fas fa-trash"></i> Delete
                                </button>
                            </div>
                        </div>
                    `).join('');
                }
            }

            updateStats();
        }

        function updateStats() {
            const totalProducts = document.getElementById('total-products');
            const totalCategories = document.getElementById('total-categories');
            const totalOrders = document.getElementById('total-orders');
            const totalCustomers = document.getElementById('total-customers');
            const productCount = document.getElementById('product-count');
            const productCountBadge = document.getElementById('product-count-badge');
            
            if (totalProducts) totalProducts.textContent = products.length;
            if (totalCategories) totalCategories.textContent = categories.length;
            if (totalOrders) totalOrders.textContent = localStorage.getItem('orderCount') || 0;
            if (totalCustomers) totalCustomers.textContent = localStorage.getItem('customerCount') || 0;
            if (productCount) productCount.textContent = products.length;
            if (productCountBadge) productCountBadge.textContent = products.length;
        }

        // ============================================
        // CATEGORY MANAGEMENT
        // ============================================
        function addCategory() {
            const name = document.getElementById('new-cat-name').value.trim();
            if (name && !categories.includes(name)) {
                categories.push(name);
                localStorage.setItem('myCategories', JSON.stringify(categories));
                document.getElementById('new-cat-name').value = '';
                renderCategoriesBar();
                renderAdminPanel();
                updateStats();
                updateHeroStats();
                renderFooterCategories();
                showToast('Category added!', 'success');
            } else if (!name) {
                showToast('Please enter a category name.', 'error');
            } else {
                showToast('Category already exists.', 'error');
            }
        }

        function deleteCategory(index) {
            if (confirm('Delete this category?')) {
                categories.splice(index, 1);
                localStorage.setItem('myCategories', JSON.stringify(categories));
                renderCategoriesBar();
                renderAdminPanel();
                updateStats();
                updateHeroStats();
                renderFooterCategories();
                showToast('Category deleted.', 'success');
            }
        }

        // ============================================
        // PRODUCT MANAGEMENT
        // ============================================
        function deleteProduct(index) {
            if (confirm('Delete this product?')) {
                products.splice(index, 1);
                localStorage.setItem('myProducts', JSON.stringify(products));
                displayProducts(products);
                renderAdminPanel();
                updateStats();
                updateHeroStats();
                renderFooterCategories();
                showToast('Product deleted.', 'success');
            }
        }

        // ============================================
        // EXPOSE FUNCTIONS
        // ============================================
        window.addOption = addOption;
        window.removeOption = removeOption;
        window.removeImage = removeImage;
        window.renderImagePreviews = renderImagePreviews;
        window.setupImageUpload = setupImageUpload;
        window.loadSavedOptions = loadSavedOptions;
        window.addProduct = addProduct;
        window.addProductSmart = addProductSmart;
        window.renderAdminPanel = renderAdminPanel;
        window.updateStats = updateStats;
        window.addCategory = addCategory;
        window.deleteCategory = deleteCategory;
        window.deleteProduct = deleteProduct;
    </script>
</body>
</html>
