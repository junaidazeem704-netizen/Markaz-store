<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Checkout - Markaz Store</title>
    <link rel="stylesheet" href="style.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <style>
        .checkout-wrapper {
            max-width: 900px;
            margin: 0 auto;
            padding: 40px 24px;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .checkout-card {
            background: var(--bg-card);
            border: var(--border);
            border-radius: var(--radius-lg);
            padding: 40px 48px;
            width: 100%;
            box-shadow: var(--shadow-lg);
        }

        .checkout-header {
            text-align: center;
            margin-bottom: 32px;
        }

        .checkout-header .logo-icon {
            font-size: 2.4rem;
            color: var(--accent);
            margin-bottom: 8px;
        }

        .checkout-header h1 {
            font-size: 1.8rem;
            font-weight: 800;
        }

        .checkout-header p {
            color: var(--text-secondary);
        }

        .checkout-summary {
            background: var(--bg-primary);
            border-radius: var(--radius-md);
            padding: 20px 24px;
            margin-bottom: 28px;
            border: var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        .checkout-summary .product-info {
            display: flex;
            flex-direction: column;
        }

        .checkout-summary .product-info .title {
            font-weight: 600;
            font-size: 1.1rem;
        }

        .checkout-summary .product-info .category {
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        .checkout-summary .price {
            font-size: 1.6rem;
            font-weight: 700;
            color: var(--accent);
        }

        .checkout-form {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .checkout-form .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .checkout-form .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .checkout-form .form-group label {
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-secondary);
        }

        .checkout-form .form-group label .required {
            color: var(--danger);
        }

        .checkout-form .form-group input,
        .checkout-form .form-group textarea {
            padding: 14px 18px;
            background: var(--bg-primary);
            border: var(--border);
            border-radius: var(--radius-sm);
            color: var(--text-primary);
            font-size: 0.95rem;
            font-family: inherit;
            transition: var(--transition);
            outline: none;
        }

        .checkout-form .form-group input:focus,
        .checkout-form .form-group textarea:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }

        .checkout-form .form-group input::placeholder,
        .checkout-form .form-group textarea::placeholder {
            color: var(--text-muted);
        }

        .checkout-form .form-group textarea {
            resize: vertical;
            min-height: 80px;
        }

        .checkout-form .form-group .input-icon {
            position: relative;
        }

        .checkout-form .form-group .input-icon i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
        }

        .checkout-form .form-group .input-icon input {
            padding-left: 42px;
        }

        .checkout-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 8px;
        }

        .checkout-actions .btn-primary {
            width: 100%;
            justify-content: center;
            padding: 16px;
            font-size: 1.05rem;
        }

        .checkout-actions .btn-secondary {
            width: 100%;
            justify-content: center;
            padding: 16px;
            font-size: 1.05rem;
        }

        /* Success Box */
        .success-box {
            text-align: center;
            padding: 40px 20px;
            display: none;
        }

        .success-box .icon {
            font-size: 4rem;
            color: var(--success);
            margin-bottom: 16px;
        }

        .success-box h2 {
            font-size: 1.8rem;
            font-weight: 800;
            margin-bottom: 8px;
        }

        .success-box p {
            color: var(--text-secondary);
            max-width: 400px;
            margin: 0 auto 24px;
        }

        .success-box .order-details {
            background: var(--bg-primary);
            border-radius: var(--radius-md);
            padding: 16px 20px;
            margin-bottom: 24px;
            text-align: left;
            border: var(--border);
        }

        .success-box .order-details .detail {
            display: flex;
            justify-content: space-between;
            padding: 6px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .success-box .order-details .detail:last-child {
            border-bottom: none;
        }

        .success-box .order-details .detail .label {
            color: var(--text-secondary);
        }

        .success-box .order-details .detail .value {
            font-weight: 500;
        }

        @media (max-width: 768px) {
            .checkout-card {
                padding: 24px 20px;
            }
            .checkout-form .form-row {
                grid-template-columns: 1fr;
            }
            .checkout-actions {
                grid-template-columns: 1fr;
            }
            .checkout-summary {
                flex-direction: column;
                text-align: center;
            }
        }
    </style>
</head>
<body>

    <div class="checkout-wrapper">
        <div class="checkout-card">
            <!-- Checkout Header -->
            <div class="checkout-header">
                <div class="logo-icon">
                    <i class="fas fa-store-alt"></i>
                </div>
                <h1>Checkout</h1>
                <p>Complete your order details below</p>
            </div>

            <!-- Checkout Form -->
            <div id="checkout-form-box">
                <!-- Order Summary -->
                <div class="checkout-summary">
                    <div class="product-info">
                        <span class="title" id="checkout-product-title">Product Title</span>
                        <span class="category" id="checkout-product-category">Category</span>
                    </div>
                    <div class="price" id="checkout-product-price">Rs. 0</div>
                </div>

                <!-- Form -->
                <form class="checkout-form" id="checkout-form" onsubmit="return false;">
                    <div class="form-row">
                        <div class="form-group">
                            <label>Full Name <span class="required">*</span></label>
                            <div class="input-icon">
                                <i class="fas fa-user"></i>
                                <input type="text" id="c-name" placeholder="Enter your full name" required />
                            </div>
                        </div>
                        <div class="form-group">
                            <label>Email Address <span class="required">*</span></label>
                            <div class="input-icon">
                                <i class="fas fa-envelope"></i>
                                <input type="email" id="c-email" placeholder="your@email.com" required />
                            </div>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label>Phone Number <span class="required">*</span></label>
                            <div class="input-icon">
                                <i class="fas fa-phone"></i>
                                <input type="tel" id="c-phone" placeholder="e.g. 03001234567" required />
                            </div>
                        </div>
                        <div class="form-group">
                            <label>Delivery Address <span class="required">*</span></label>
                            <div class="input-icon">
                                <i class="fas fa-map-marker-alt"></i>
                                <input type="text" id="c-address" placeholder="Complete street address, city" required />
                            </div>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Order Notes (Optional)</label>
                        <textarea id="c-notes" placeholder="Any special instructions for delivery..."></textarea>
                    </div>

                    <div class="checkout-actions">
                        <button class="btn-primary" onclick="submitOrder()">
                            <i class="fas fa-check-circle"></i> Place Order
                        </button>
                        <button class="btn-secondary" onclick="window.location.href='index.html'">
                            <i class="fas fa-arrow-left"></i> Back to Store
                        </button>
                    </div>
                </form>
            </div>

            <!-- Success Box -->
            <div class="success-box" id="success-box">
                <div class="icon">
                    <i class="fas fa-check-circle"></i>
                </div>
                <h2>Order Placed! 🎉</h2>
                <p>Your order has been confirmed. We'll send you a confirmation email shortly.</p>
                <div class="order-details" id="order-details">
                    <div class="detail">
                        <span class="label">Order ID</span>
                        <span class="value" id="order-id">#MK-2024-001</span>
                    </div>
                    <div class="detail">
                        <span class="label">Product</span>
                        <span class="value" id="order-product">-</span>
                    </div>
                    <div class="detail">
                        <span class="label">Total</span>
                        <span class="value" id="order-total">-</span>
                    </div>
                    <div class="detail">
                        <span class="label">Email</span>
                        <span class="value" id="order-email">-</span>
                    </div>
                </div>
                <button class="btn-primary" onclick="window.location.href='index.html'">
                    <i class="fas fa-store"></i> Continue Shopping
                </button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
