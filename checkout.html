<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Checkout - Markaz Store</title>
    <link rel="stylesheet" href="style.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <div class="checkout-wrapper" style="max-width:600px;margin:80px auto;padding:20px;background:#1a1a2e;border-radius:16px;">
        <h2>Checkout</h2>
        <form id="checkout-form" onsubmit="event.preventDefault(); submitOrder();">
            <div style="margin-bottom:12px;">
                <label>Full Name</label>
                <input type="text" id="c-name" required style="width:100%;padding:10px;background:#0a0a12;border:1px solid #333;color:white;border-radius:8px;" />
            </div>
            <div style="margin-bottom:12px;">
                <label>Email</label>
                <input type="email" id="c-email" required style="width:100%;padding:10px;background:#0a0a12;border:1px solid #333;color:white;border-radius:8px;" />
            </div>
            <div style="margin-bottom:12px;">
                <label>Phone</label>
                <input type="tel" id="c-phone" required style="width:100%;padding:10px;background:#0a0a12;border:1px solid #333;color:white;border-radius:8px;" />
            </div>
            <div style="margin-bottom:12px;">
                <label>Address</label>
                <input type="text" id="c-address" required style="width:100%;padding:10px;background:#0a0a12;border:1px solid #333;color:white;border-radius:8px;" />
            </div>
            <button type="submit" style="width:100%;padding:12px;background:#6366f1;color:white;border:none;border-radius:8px;font-weight:700;cursor:pointer;">Place Order</button>
        </form>
    </div>

    <script>
        const SUPABASE_URL = 'https://vnzipnxrasonkhlwcynq.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZuemlwbnhyYXNvbmtobHdjeW5xIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDA5MjY0ODcsImV4cCI6MjA1NjUwMjQ4N30.KfgUQ-fn1L0A_Jv3pFESuC8jR1R7S_iC9RPNlWpTbJ0';
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function submitOrder() {
            const name = document.getElementById('c-name').value.trim();
            const email = document.getElementById('c-email').value.trim();
            const phone = document.getElementById('c-phone').value.trim();
            const address = document.getElementById('c-address').value.trim();

            const cart = JSON.parse(localStorage.getItem('cart') || '[]');
            if(!cart.length) { alert('Cart empty'); return; }

            let total = 0;
            const itemsList = cart.map(i => {
                total += parseInt(i.price) * i.quantity;
                return `${i.title} x${i.quantity}`;
            }).join(', ');

            const orderData = {
                order_id: 'MK-' + Date.now().toString().slice(-6),
                items: itemsList,
                total: total,
                name: name,
                email: email,
                phone: phone,
                address: address,
                status: 'processing'
            };

            const { error } = await supabase.from('orders').insert([orderData]);

            if (!error) {
                localStorage.setItem('cart', '[]');
                alert('🎉 Order Placed Successfully!');
                window.location.href = 'index.html';
            } else {
                alert('Order Error: ' + error.message);
            }
        }
    </script>
</body>
</html>
