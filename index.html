<!DOCTYPE html>
<html lang="ur">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Markaz Store - Online Shopping</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans">

    <!-- Top Bar -->
    <div class="bg-indigo-600 text-white text-[11px] font-semibold text-center py-2 px-4 shadow-md">
        ⚡ FREE DELIVERY ALL OVER PAKISTAN ON ORDERS ABOVE RS. 3000 🚚
    </div>

    <!-- Header -->
    <header class="border-b border-slate-800 bg-slate-900/80 backdrop-blur sticky top-0 z-50 px-4 py-3">
        <div class="max-w-md mx-auto flex items-center justify-between">
            <a href="index.html" class="flex items-center gap-2 text-xl font-bold text-white">
                <span>🛍️</span>
                <span>Markaz Store</span>
            </a>
            <span class="text-[10px] bg-indigo-900/80 text-indigo-300 border border-indigo-700/50 px-2 py-0.5 rounded-full font-mono">VERIFIED</span>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-md mx-auto p-4 space-y-6">

        <!-- Category Filters Bar -->
        <div id="category-bar" class="flex items-center gap-2 overflow-x-auto no-scrollbar pb-1">
            <!-- Dynamic JS Category Buttons -->
        </div>

        <!-- Horizontal Product Deck -->
        <div class="relative">
            <div class="flex items-center justify-between mb-3">
                <h2 class="text-sm font-bold text-indigo-400">🔥 Trending Collection (Swipe ➔)</h2>
                <div class="flex gap-1">
                    <button onclick="scrollProducts(-220)" class="bg-slate-800 hover:bg-slate-700 text-white w-7 h-7 rounded-full text-xs font-bold">❮</button>
                    <button onclick="scrollProducts(220)" class="bg-slate-800 hover:bg-slate-700 text-white w-7 h-7 rounded-full text-xs font-bold">❯</button>
                </div>
            </div>

            <!-- Products Deck Container -->
            <div id="product-container" class="flex gap-4 overflow-x-auto snap-x snap-mandatory no-scrollbar scroll-smooth pb-4 min-h-[320px]">
                <p class="text-slate-500 text-xs py-8">Loading products...</p>
            </div>
        </div>

    </main>

    <footer class="border-t border-slate-900 text-center py-6 text-xs text-slate-600 mt-10">
        © 2026 Markaz Store. All rights reserved.
    </footer>

    <script src="script.js"></script>
    <script>
        function scrollProducts(amount) {
            document.getElementById('product-container').scrollBy({ left: amount, behavior: 'smooth' });
        }
    </script>
</body>
</html>
