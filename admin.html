<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Panel - Markaz Store</title>
    <link rel="stylesheet" href="style.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', sans-serif;
            background: #0a0a12;
            color: #ffffff;
            padding: 16px;
            min-height: 100vh;
        }
        .admin-wrapper { max-width: 600px; margin: 0 auto; }

        /* Header */
        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            background: rgba(26, 26, 46, 0.85);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 16px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 10px;
        }
        .admin-header h1 {
            font-size: 1.3rem;
            font-weight: 800;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .admin-header-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .admin-header-actions a {
            padding: 8px 14px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 8px;
            color: #a0a0b8;
            text-decoration: none;
            font-size: 0.8rem;
        }
        .btn-danger {
            padding: 8px 14px;
            background: rgba(239,68,68,0.12);
            border: 1px solid rgba(239,68,68,0.2);
            border-radius: 8px;
            color: #ef4444;
            font-size: 0.8rem;
            cursor: pointer;
            font-family: inherit;
        }

        /* Stats */
        .admin-stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }
        .admin-stat-card {
            background: rgba(26, 26, 46, 0.85);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 12px;
            padding: 16px 20px;
        }
        .admin-stat-card .label {
            font-size: 0.7rem;
            color: #a0a0b8;
            text-transform: uppercase;
        }
        .admin-stat-card .value {
            font-size: 1.6rem;
            font-weight: 700;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Cards */
        .admin-card {
            background: rgba(26, 26, 46, 0.85);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 16px;
        }
        .admin-card h2 {
            font-size: 1rem;
            font-weight: 700;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .admin-card h2 i { color: #6366f1; }

        /* Form */
        .form-group {
            margin-bottom: 12px;
        }
        .form-group label {
            font-size: 0.85rem;
            font-weight: 500;
            color: #a0a0b8;
            display: block;
            margin-bottom: 4px;
        }
        .form-group label .required { color: #ef4444; }
        .form-group input {
            width: 100%;
            padding: 12px 16px;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 10px;
            color: #ffffff;
            font-size: 0.95rem;
            outline: none;
        }
        .form-group input:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99,102,241,0.1);
        }
        .form-group input::placeholder { color: #6a6a82; }
        .form-group small {
            font-size: 0.75rem;
            color: #6a6a82;
        }
        .form-group small i { color: #6366f1; }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        /* Buttons */
        .btn-primary {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .btn-primary:active { transform: scale(0.98); }

        .btn-secondary {
            width: 100%;
            padding: 14px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 10px;
            color: #a0a0b8;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            font-family: inherit;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-sm {
            padding: 8px 16px;
            font-size: 0.8rem;
            width: auto;
        }

        .form-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 8px;
        }

        /* Image Upload */
        .image-upload-area {
            border: 2px dashed rgba(255,255,255,0.08);
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            position: relative;
            background: rgba(255,255,255,0.02);
        }
        .image-upload-area input[type="file"] {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            opacity: 0;
            cursor: pointer;
        }
        .image-upload-area i {
            font-size: 2rem;
            color: #6366f1;
            display: block;
            margin-bottom: 4px;
        }
        .image-upload-area p { color: #a0a0b8; font-size: 0.85rem; }
        .image-upload-area .sub { color: #6a6a82; font-size: 0.7rem; }

        .image-preview-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(70px, 1fr));
            gap: 10px;
            margin-top: 12px;
        }
        .image-preview-item {
            position: relative;
            border-radius: 8px;
            overflow: hidden;
            aspect-ratio: 1;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.06);
        }
        .image-preview-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .image-preview-item .remove-img {
            position: absolute;
            top: 4px;
            right: 4px;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: rgba(0,0,0,0.7);
            border: none;
            color: white;
            cursor: pointer;
            font-size: 0.6rem;
        }

        /* Options */
        .options-group {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 4px;
            min-height: 30px;
        }
        .option-tag {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 4px 10px 4px 14px;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 100px;
            font-size: 0.8rem;
        }
        .option-tag .remove {
            cursor: pointer;
            color: #ef4444;
            background: none;
            border: none;
            font-size: 0.9rem;
        }
        .option-input-row {
            display: flex;
            gap: 8px;
            margin-top: 8px;
        }
        .option-input-row input {
            flex: 1;
            padding: 8px 14px;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 8px;
            color: #ffffff;
            font-size: 0.9rem;
            outline: none;
        }
        .option-input-row input:focus { border-color: #6366f1; }

        /* Category Tags */
        .category-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 4px;
        }
        .category-tag {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 4px 10px 4px 14px;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 100px;
            font-size: 0.8rem;
        }
        .category-tag .remove {
            cursor: pointer;
            color: #ef4444;
            background: none;
            border: none;
            font-size: 0.9rem;
        }
        .category-input-row {
            display: flex;
            gap: 10px;
            margin-bottom: 12px;
        }
        .category-input-row input {
            flex: 1;
            padding: 10px 14px;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 8px;
            color: #ffffff;
            font-size: 0.9rem;
            outline: none;
        }
        .category-input-row input:focus { border-color: #6366f1; }

        /* Product List */
        .product-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 14px;
            background: rgba(255,255,255,0.03);
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.06);
            margin-bottom: 8px;
            flex-wrap: wrap;
            gap: 8px;
        }
        .product-item .info {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .product-item .info img {
            width: 40px;
            height: 40px;
            object-fit: cover;
            border-radius: 6px;
        }
        .product-item .info .title { font-weight: 500; font-size: 0.9rem; }
        .product-item .info .category {
            font-size: 0.7rem;
            color: #a0a0b8;
        }
        .product-item .btn-danger {
            padding: 4px 12px;
            font-size: 0.7rem;
        }

        .empty-state {
            text-align: center;
            padding: 30px 20px;
            color: #6a6a82;
        }
        .empty-state i {
            font-size: 2rem;
            display: block;
            margin-bottom: 8px;
        }

        .product-count {
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: white;
            padding: 2px 10px;
            border-radius: 100px;
            font-size: 0.7rem;
            font-weight: 600;
            margin-left: 8px;
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 20px;
            left: 16px;
            right: 16px;
            background: rgba(26, 26, 46, 0.95);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 12px;
            padding: 14px 18px;
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 9999;
            transform: translateY(120px);
            opacity: 0;
            transition: all 0.5s ease;
        }
        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }
        .toast-icon {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: rgba(16,185,129,0.12);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .toast-icon i { color: #10b981; font-size: 1rem; }
        .toast.error .toast-icon { background: rgba(239,68,68,0.12); }
        .toast.error .toast-icon i { color: #ef4444; }
        .toast-content { flex: 1; }
        .toast-title { font-size: 0.8rem; font-weight: 600; }
        .toast-message { font-size: 0.75rem; color: #a0a0b8; }
        .toast-close {
            background: none;
            border: none;
            color: #6a6a82;
            cursor: pointer;
            font-size: 1.2rem;
        }

        /* Suggestions */
        .suggestions-container { position: relative; }
        .suggestions-dropdown {
            position: absolute;
            top: calc(100% + 4px);
            left: 0;
            right: 0;
            background: #1a1a2e;
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 8px;
            max-height: 150px;
            overflow-y: auto;
            display: none;
            z-index: 100;
        }
        .suggestion-item {
            padding: 8px 14px;
            cursor: pointer;
            font-size: 0.85rem;
            border-bottom: 1px solid rgba(255,255,255,0.04);
            color: #a0a0b8;
        }
        .suggestion-item:hover { background: rgba(255,255,255,0.05); color: #ffffff; }
        .suggestion-item.new-category { color: #6366f1; font-weight: 500; }

        /* Auto-Detect */
        .auto-detect-btn {
            background: linear-gradient(135deg, #8b5cf6, #6366f1);
            color: white;
            border: none;
            padding: 4px 14px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 500;
            cursor: pointer;
            font-family: inherit;
            margin-left: 6px;
        }
        .detected-colors {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 6px;
            min-height: 30px;
        }
        .detected-color-chip {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 2px 10px 2px 6px;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 100px;
            font-size: 0.75rem;
        }
        .detected-color-chip .color-dot {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .detected-color-chip .remove {
            cursor: pointer;
            color: #ef4444;
            background: none;
            border: none;
            font-size: 0.8rem;
        }

        .image-analysis-progress {
            display: none;
            margin-top: 6px;
            padding: 8px 12px;
            background: rgba(255,255,255,0.04);
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.06);
        }
        .image-analysis-progress .status-text {
            font-size: 0.75rem;
            color: #a0a0b8;
        }
        .image-analysis-progress .progress-bar {
            width: 100%;
            height: 3px;
            background: rgba(255,255,255,0.06);
            border-radius: 2px;
            overflow: hidden;
            margin-top: 4px;
        }
        .image-analysis-progress .progress-bar .fill {
            height: 100%;
            background: linear-gradient(90deg, #6366f1, #8b5cf6);
            border-radius: 2px;
            transition: width 0.5s ease;
            width: 0%;
        }

        /* Responsive */
        @media (max-width: 480px) {
            .form-row { grid-template-columns: 1fr; }
            .form-actions { grid-template-columns: 1fr; }
            .admin-stats { grid-template-columns: 1fr 1fr; gap: 8px; }
            .admin-stat-card { padding: 12px 16px; }
            .admin-stat-card .value { font-size: 1.2rem; }
        }
    </style>
</head>
<body>

    <div class="admin-wrapper">
        <!-- Header -->
        <header class="admin-header">
            <h1>⚙️ Store</h1>
            <div class="admin-header-actions">
                <a href="index.html"><i class="fas fa-store"></i> Store</a>
                <button class="btn-danger" onclick="resetStorage()"><i class="fas fa-trash-alt"></i></button>
            </div>
        </header>

        <!-- Stats -->
        <div class="admin-stats">
            <div class="admin-stat-card">
                <div class="label">📦 Products</div>
                <div class="value" id="total-products">0</div>
            </div>
            <div class="admin-stat-card">
                <div class="label">🏷️ Categories</div>
                <div class="value" id="total-categories">0</div>
            </div>
            <div class="admin-stat-card">
                <div class="label">📊 Orders</div>
                <div class="value" id="total-orders">0</div>
            </div>
            <div class="admin-stat-card">
                <div class="label">🎨 Colors</div>
                <div class="value" id="total-colors">0</div>
            </div>
        </div>

        <!-- Add Product -->
        <div class="admin-card">
            <h2><i class="fas fa-plus-circle"></i> Add Product</h2>
            
            <div class="form-group">
                <label>Title <span class="required">*</span></label>
                <input type="text" id="p-title" placeholder="Product title" />
            </div>
            
            <div class="form-group">
                <label>Price (PKR) <span class="required">*</span></label>
                <input type="number" id="p-price" placeholder="2500" />
            </div>

            <div class="form-group">
                <label>Category <span class="required">*</span></label>
                <div class="suggestions-container">
                    <input type="text" id="p-category-input" placeholder="Type or auto-detect" />
                    <div class="suggestions-dropdown" id="category-suggestions-product"></div>
                </div>
                <small><i class="fas fa-magic"></i> Auto-detects from title</small>
            </div>

            <div class="form-group">
                <label>Images <span class="required">*</span></label>
                <div class="image-upload-area">
                    <i class="fas fa-cloud-upload-alt"></i>
                    <p>Tap to upload</p>
                    <span class="sub">Max 5 images</span>
                    <input type="file" id="p-images" accept="image/*" multiple />
                </div>
                
                <div class="image-analysis-progress" id="analysis-progress">
                    <div class="status-text" id="analysis-status">🔍 Analyzing...</div>
                    <div class="progress-bar">
                        <div class="fill" id="analysis-fill"></div>
                    </div>
                </div>
                
                <div class="image-preview-grid" id="image-preview-grid"></div>
                
                <div style="margin-top:8px;">
                    <label style="font-size:0.8rem;color:#a0a0b8;">
                        <i class="fas fa-palette"></i> Detected Colors
                        <button class="auto-detect-btn" onclick="analyzeImagesForColors()">
                            <i class="fas fa-magic"></i> Detect
                        </button>
                    </label>
                    <div class="detected-colors" id="detected-colors-container"></div>
                    <input type="hidden" id="p-colors-detected" value="[]" />
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label><i class="fas fa-ruler"></i> Sizes</label>
                    <div class="options-group" id="sizes-container"></div>
                    <div class="option-input-row">
                        <input type="text" id="size-input" placeholder="S, M, L, XL" />
                        <button class="btn-secondary btn-sm" onclick="addOption('size')">
                            <i class="fas fa-plus"></i>
                        </button>
                    </div>
                    <input type="hidden" id="p-sizes" value="[]" />
                </div>
                <div class="form-group">
                    <label><i class="fas fa-tag"></i> Manual Colors</label>
                    <div class="options-group" id="colors-container"></div>
                    <div class="option-input-row">
                        <input type="text" id="color-input" placeholder="Black, White" />
                        <button class="btn-secondary btn-sm" onclick="addOption('color')">
                            <i class="fas fa-plus"></i>
                        </button>
                    </div>
                    <input type="hidden" id="p-colors" value="[]" />
                </div>
            </div>

            <div class="form-actions">
                <button class="btn-primary" onclick="addProduct()">
                    <i class="fas fa-plus"></i> Add Product
                </button>
                <button class="btn-secondary" onclick="addProductSmart()">
                    <i class="fas fa-magic"></i> Auto
                </button>
            </div>
        </div>

        <!-- Categories -->
        <div class="admin-card">
            <h2><i class="fas fa-tags"></i> Categories</h2>
            <div class="category-input-row">
                <div class="suggestions-container">
                    <input type="text" id="new-cat-name" placeholder="New category..." />
                    <div class="suggestions-dropdown" id="category-suggestions"></div>
                </div>
                <button class="btn-secondary btn-sm" onclick="addCategory()">
                    <i class="fas fa-plus"></i>
                </button>
            </div>
            <div class="category-tags" id="categories-list"></div>
        </div>

        <!-- Products List -->
        <div class="admin-card">
            <h2>
                <i class="fas fa-box"></i> All Products
                <span class="product-count" id="product-count">0</span>
            </h2>
            <div id="admin-products-list"></div>
            <div class="empty-state" id="empty-products">
                <i class="fas fa-box-open"></i>
                No products added
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast">
        <div class="toast-icon"><i class="fas fa-check-circle"></i></div>
        <div class="toast-content">
            <span class="toast-title">Success!</span>
            <span class="toast-message" id="toast-message">Product added</span>
        </div>
        <button class="toast-close" onclick="this.parentElement.classList.remove('show')">
            <i class="fas fa-times"></i>
        </button>
    </div>

    <script>
        // ============================================
        // CONFIGURATION
        // ============================================
        const IMGBB_API_KEY = '311cba478ef03480a9e99f45226dc6ac';

        // ============================================
        // STATE
        // ============================================
        let categories = JSON.parse(localStorage.getItem('myCategories')) || ['Watches', 'Clothing', 'Electronics'];
        let products = JSON.parse(localStorage.getItem('myProducts')) || [];
        let uploadedImages = [];
        let detectedColors = [];
        let sizes = [];
        let manualColors = [];
        let isAnalyzing = false;

        // ============================================
        // DOM READY
        // ============================================
        document.addEventListener('DOMContentLoaded', function() {
            renderAdminPanel();
            updateStats();
            setupImageUpload();
            loadSavedOptions();
            setupCategorySuggestions('new-cat-name', 'category-suggestions');
            setupCategorySuggestions('p-category-input', 'category-suggestions-product');
        });

        // ============================================
        // IMAGE UPLOAD
        // ============================================
        function setupImageUpload() {
            const input = document.getElementById('p-images');
            if (!input) return;
            input.addEventListener('change', function(e) {
                const files = e.target.files;
                for (let file of files) {
                    if (uploadedImages.length >= 5) {
                        showToast('Max 5 images!', 'warning');
                        break;
                    }
                    const reader = new FileReader();
                    reader.onload = function(event) {
                        uploadedImages.push(event.target.result);
                        renderImagePreviews();
                        setTimeout(analyzeImagesForColors, 300);
                    };
                    reader.readAsDataURL(file);
                }
                e.target.value = '';
            });
        }

        function renderImagePreviews() {
            const grid = document.getElementById('image-preview-grid');
            if (!grid) return;
            if (uploadedImages.length === 0) {
                grid.innerHTML = '';
                document.getElementById('p-images-data').value = '[]';
                return;
            }
            grid.innerHTML = uploadedImages.map((img, i) => `
                <div class="image-preview-item">
                    <img src="${img}" alt="Image ${i+1}" />
                    <button class="remove-img" onclick="removeImage(${i})">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
            `).join('');
            document.getElementById('p-images-data').value = JSON.stringify(uploadedImages);
        }

        function removeImage(index) {
            uploadedImages.splice(index, 1);
            renderImagePreviews();
            if (uploadedImages.length > 0) {
                analyzeImagesForColors();
            } else {
                detectedColors = [];
                renderDetectedColors();
                document.getElementById('p-colors-detected').value = '[]';
                document.getElementById('total-colors').textContent = 0;
            }
        }

        // ============================================
        // COLOR DETECTION
        // ============================================
        async function analyzeImagesForColors() {
            if (uploadedImages.length === 0) {
                showToast('Upload images first!', 'warning');
                return;
            }
            if (isAnalyzing) return;
            isAnalyzing = true;
            
            const btn = document.querySelector('.auto-detect-btn');
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
            
            const progress = document.getElementById('analysis-progress');
            progress.style.display = 'block';
            
            detectedColors = [];
            const colorThief = new ColorThief();
            
            for (let i = 0; i < uploadedImages.length; i++) {
                const pct = ((i + 1) / uploadedImages.length) * 100;
                document.getElementById('analysis-fill').style.width = pct + '%';
                document.getElementById('analysis-status').textContent = `🔍 Image ${i+1}/${uploadedImages.length}`;
                
                try {
                    const img = new Image();
                    img.crossOrigin = 'Anonymous';
                    await new Promise((resolve, reject) => {
                        img.onload = resolve;
                        img.onerror = reject;
                        img.src = uploadedImages[i];
                    });
                    const color = colorThief.getColor(img);
                    if (color) {
                        const [r, g, b] = color;
                        const name = rgbToColorName(r, g, b);
                        const hex = rgbToHex(r, g, b);
                        if (!detectedColors.some(c => c.name === name)) {
                            detectedColors.push({ name, hex, r, g, b });
                        }
                    }
                } catch (e) { console.error(e); }
            }
            
            renderDetectedColors();
            document.getElementById('p-colors-detected').value = JSON.stringify(detectedColors);
            document.getElementById('total-colors').textContent = detectedColors.length;
            
            document.getElementById('analysis-status').textContent = `✅ ${detectedColors.length} colors`;
            document.getElementById('analysis-fill').style.width = '100%';
            
            btn.disabled = false;
            btn.innerHTML = '<i class="fas fa-magic"></i> Detect';
            setTimeout(() => { progress.style.display = 'none'; }, 1500);
            isAnalyzing = false;
            
            if (detectedColors.length > 0) {
                showToast(`🎨 ${detectedColors.length} colors detected`, 'success');
            }
        }

        function renderDetectedColors() {
            const container = document.getElementById('detected-colors-container');
            if (!container) return;
            if (detectedColors.length === 0) {
                container.innerHTML = '<span style="color:#6a6a82;font-size:0.8rem;">Upload and click "Detect"</span>';
                return;
            }
            container.innerHTML = detectedColors.map((c, i) => `
                <span class="detected-color-chip">
                    <span class="color-dot" style="background:${c.hex};"></span>
                    ${c.name}
                    <button class="remove" onclick="removeDetectedColor(${i})">×</button>
                </span>
            `).join('');
        }

        function removeDetectedColor(index) {
            detectedColors.splice(index, 1);
            document.getElementById('p-colors-detected').value = JSON.stringify(detectedColors);
            renderDetectedColors();
            document.getElementById('total-colors').textContent = detectedColors.length;
        }

        // ============================================
        // COLOR HELPERS
        // ============================================
        function rgbToColorName(r, g, b) {
            const colors = {
                'Black': [0,0,0], 'White': [255,255,255], 'Red': [255,0,0],
                'Green': [0,255,0], 'Blue': [0,0,255], 'Yellow': [255,255,0],
                'Orange': [255,165,0], 'Purple': [128,0,128], 'Pink': [255,192,203],
                'Brown': [165,42,42], 'Gray': [128,128,128], 'Navy': [0,0,128],
                'Gold': [255,215,0], 'Silver': [192,192,192], 'Beige': [245,245,220],
                'Maroon': [128,0,0], 'Olive': [128,128,0], 'Teal': [0,128,128],
                'Cyan': [0,255,255], 'Magenta': [255,0,255], 'Lime': [0,255,0],
                'Violet': [238,130,238], 'Coral': [255,127,80], 'Salmon': [250,128,114],
                'Turquoise': [64,224,208], 'Lavender': [230,230,250], 'Cream': [255,253,208]
            };
            let closest = 'Unknown';
            let minDist = Infinity;
            for (const [name, [cr, cg, cb]] of Object.entries(colors)) {
                const d = Math.sqrt((r-cr)**2 + (g-cg)**2 + (b-cb)**2);
                if (d < minDist) { minDist = d; closest = name; }
            }
            return closest;
        }

        function rgbToHex(r, g, b) {
            return '#' + [r,g,b].map(x => x.toString(16).padStart(2, '0')).join('');
        }

        // ============================================
        // OPTIONS
        // ============================================
        function loadSavedOptions() {
            const s = document.getElementById('p-sizes');
            const c = document.getElementById('p-colors');
            if (s && s.value) { sizes = JSON.parse(s.value); renderOptions('size'); }
            if (c && c.value) { manualColors = JSON.parse(c.value); renderOptions('color'); }
        }

        function addOption(type) {
            const input = document.getElementById(type === 'size' ? 'size-input' : 'color-input');
            const arr = type === 'size' ? sizes : manualColors;
            const hidden = type === 'size' ? 'p-sizes' : 'p-colors';
            const val = input.value.trim();
            if (!val) { showToast('Enter value!', 'error'); return; }
            if (arr.includes(val)) { showToast('Already exists!', 'warning'); return; }
            arr.push(val);
            document.getElementById(hidden).value = JSON.stringify(arr);
            input.value = '';
            renderOptions(type);
        }

        function removeOption(type, index) {
            const arr = type === 'size' ? sizes : manualColors;
            const hidden = type === 'size' ? 'p-sizes' : 'p-colors';
            arr.splice(index, 1);
            document.getElementById(hidden).value = JSON.stringify(arr);
            renderOptions(type);
        }

        function renderOptions(type) {
            const container = document.getElementById(type === 'size' ? 'sizes-container' : 'colors-container');
            const arr = type === 'size' ? sizes : manualColors;
            if (!container) return;
            if (arr.length === 0) { container.innerHTML = ''; return; }
            container.innerHTML = arr.map((item, i) => `
                <span class="option-tag">
                    ${item}
                    <button class="remove" onclick="removeOption('${type}', ${i})">×</button>
                </span>
            `).join('');
        }

        // ============================================
        // ADD PRODUCT - MAIN
        // ============================================
        async function addProduct() {
            const title = document.getElementById('p-title').value.trim();
            const price = document.getElementById('p-price').value.trim();
            let category = document.getElementById('p-category-input').value.trim() || 'General';
            
            if (!title || !price) {
                showToast('Title and Price required!', 'error');
                return;
            }

            category = ensureCategoryExists(category);

            const imagesData = document.getElementById('p-images-data');
            const images = JSON.parse(imagesData.value || '[]');
            
            if (images.length === 0) {
                showToast('Upload at least one image!', 'error');
                return;
            }

            // Upload to IMGBB
            let imageUrls = [];
            showToast('📤 Uploading...', 'info');
            
            for (let img of images) {
                try {
                    const response = await fetch(img);
                    const blob = await response.blob();
                    const formData = new FormData();
                    formData.append('image', blob);
                    const uploadRes = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, {
                        method: 'POST',
                        body: formData
                    });
                    const result = await uploadRes.json();
                    if (result.success) {
                        imageUrls.push(result.data.url);
                    } else {
                        showToast('Upload failed!', 'error');
                        return;
                    }
                } catch (e) {
                    showToast('Upload error!', 'error');
                    return;
                }
            }

            const sizes = JSON.parse(document.getElementById('p-sizes').value || '[]');
            const manualColors = JSON.parse(document.getElementById('p-colors').value || '[]');
            const detectedColors = JSON.parse(document.getElementById('p-colors-detected').value || '[]');
            
            let allColors = [];
            detectedColors.forEach(c => { if (c.name && !allColors.includes(c.name)) allColors.push(c.name); });
            manualColors.forEach(c => { if (c && !allColors.includes(c)) allColors.push(c); });
            if (allColors.length === 0) allColors = ['Default'];

            const product = {
                title: title,
                price: price,
                category: category,
                images: imageUrls,
                sizes: sizes,
                colors: allColors,
                detectedColors: detectedColors,
                createdAt: new Date().toISOString()
            };

            products.push(product);
            localStorage.setItem('myProducts', JSON.stringify(products));

            // Clear form
            document.getElementById('p-title').value = '';
            document.getElementById('p-price').value = '';
            document.getElementById('p-category-input').value = '';
            document.getElementById('p-images-data').value = '[]';
            document.getElementById('p-sizes').value = '[]';
            document.getElementById('p-colors').value = '[]';
            document.getElementById('p-colors-detected').value = '[]';
            document.getElementById('p-images').value = '';
            
            uploadedImages = [];
            sizes = [];
            manualColors = [];
            detectedColors = [];
            renderImagePreviews();
            renderOptions('size');
            renderOptions('color');
            renderDetectedColors();

            renderAdminPanel();
            updateStats();
            showToast(`✅ "${title}" added!`, 'success');
        }

        // ============================================
        // ADD PRODUCT WITH AUTO-DETECT
        // ============================================
        async function addProductSmart() {
            const title = document.getElementById('p-title').value.trim();
            const price = document.getElementById('p-price').value.trim();
            if (!title || !price) {
                showToast('Title and Price required!', 'error');
                return;
            }
            const cat = detectCategoryFromTitle(title);
            if (cat) {
                const input = document.getElementById('p-category-input');
                if (input) { input.value = ensureCategoryExists(cat); }
                showToast(`🔍 "${cat}" detected!`, 'info');
            } else {
                showToast('No category detected!', 'warning');
                return;
            }
            await addProduct();
        }

        // ============================================
        // CATEGORY MANAGEMENT
        // ============================================
        function ensureCategoryExists(name) {
            if (!name) return 'General';
            const trimmed = name.trim();
            const existing = categories.find(c => c.toLowerCase() === trimmed.toLowerCase());
            if (existing) return existing;
            categories.push(trimmed);
            localStorage.setItem('myCategories', JSON.stringify(categories));
            renderCategoriesBar();
            renderAdminPanel();
            updateStats();
            showToast(`🏷️ "${trimmed}" created`, 'success');
            return trimmed;
        }

        function detectCategoryFromTitle(title) {
            const keywords = {
                'Watches': ['watch', 'smartwatch', 'chrono'],
                'Clothing': ['shirt', 'jeans', 'jacket', 'dress', 'hoodie', 'sweater'],
                'Electronics': ['phone', 'laptop', 'tablet', 'tv', 'speaker', 'headphone'],
                'Shoes': ['shoe', 'sneaker', 'boot'],
                'Accessories': ['bag', 'belt', 'cap', 'hat', 'sunglass', 'jewelry'],
                'Home': ['furniture', 'lamp', 'chair', 'table', 'bed', 'sofa'],
                'Books': ['book', 'novel', 'magazine'],
                'Toys': ['toy', 'game', 'puzzle', 'doll'],
                'Beauty': ['cream', 'lotion', 'shampoo', 'soap', 'perfume']
            };
            const lower = title.toLowerCase();
            for (const [cat, words] of Object.entries(keywords)) {
                for (const w of words) {
                    if (lower.includes(w)) return cat;
                }
            }
            return null;
        }

        function addCategory() {
            const name = document.getElementById('new-cat-name').value.trim();
            if (!name) { showToast('Enter name!', 'error'); return; }
            if (categories.includes(name)) { showToast('Already exists!', 'warning'); return; }
            categories.push(name);
            localStorage.setItem('myCategories', JSON.stringify(categories));
            document.getElementById('new-cat-name').value = '';
            renderCategoriesBar();
            renderAdminPanel();
            updateStats();
            showToast('Category added!', 'success');
        }

        function deleteCategory(index) {
            if (!confirm('Delete?')) return;
            categories.splice(index, 1);
            localStorage.setItem('myCategories', JSON.stringify(categories));
            renderCategoriesBar();
            renderAdminPanel();
            updateStats();
            showToast('Category deleted.', 'success');
        }

        function deleteProduct(index) {
            if (!confirm('Delete?')) return;
            products.splice(index, 1);
            localStorage.setItem('myProducts', JSON.stringify(products));
            renderAdminPanel();
            updateStats();
            showToast('Product deleted.', 'success');
        }

        // ============================================
        // CATEGORY SUGGESTIONS
        // ============================================
        function setupCategorySuggestions(inputId, containerId) {
            const input = document.getElementById(inputId);
            const container = document.getElementById(containerId);
            if (!input || !container) return;
            input.addEventListener('input', function() {
                const val = this.value.toLowerCase().trim();
                if (!val) { container.innerHTML = ''; container.style.display = 'none'; return; }
                const matches = categories.filter(c => c.toLowerCase().includes(val));
                if (matches.length > 0) {
                    container.innerHTML = matches.map(c => 
                        `<div class="suggestion-item" onclick="selectCategory('${c}')">${c}</div>`
                    ).join('');
                    container.style.display = 'block';
                } else {
                    container.innerHTML = `<div class="suggestion-item new-category" onclick="createNewCategory('${val}')">
                        ➕ Create "${val}"
                    </div>`;
                    container.style.display = 'block';
                }
            });
            input.addEventListener('blur', function() {
                setTimeout(() => { container.style.display = 'none'; }, 200);
            });
        }

        function selectCategory(category) {
            const input = document.getElementById('new-cat-name') || document.getElementById('p-category-input');
            if (input) {
                input.value = category;
                const container = document.getElementById('category-suggestions') || document.getElementById('category-suggestions-product');
                if (container) container.style.display = 'none';
                if (!categories.includes(category)) ensureCategoryExists(category);
            }
        }

        function createNewCategory(name) {
            if (name && name.trim()) {
                const trimmed = name.trim();
                if (!categories.includes(trimmed)) {
                    ensureCategoryExists(trimmed);
                    const input = document.getElementById('new-cat-name') || document.getElementById('p-category-input');
                    if (input) {
                        input.value = trimmed;
                        const container = document.getElementById('category-suggestions') || document.getElementById('category-suggestions-product');
                        if (container) container.style.display = 'none';
                    }
                    renderAdminPanel();
                }
            }
        }

        // ============================================
        // RENDER FUNCTIONS
        // ============================================
        function renderAdminPanel() {
            // Categories
            const catList = document.getElementById('categories-list');
            if (catList) {
                if (categories.length === 0) {
                    catList.innerHTML = '<span style="color:#6a6a82;font-size:0.8rem;">No categories</span>';
                } else {
                    catList.innerHTML = categories.map((c, i) => `
                        <span class="category-tag">
                            ${c}
                            <button class="remove" onclick="deleteCategory(${i})">×</button>
                        </span>
                    `).join('');
                }
            }

            // Products
            const prodList = document.getElementById('admin-products-list');
            const emptyMsg = document.getElementById('empty-products');
            if (prodList) {
                if (products.length === 0) {
                    prodList.innerHTML = '';
                    if (emptyMsg) emptyMsg.style.display = 'block';
                } else {
                    if (emptyMsg) emptyMsg.style.display = 'none';
                    prodList.innerHTML = products.map((p, i) => `
                        <div class="product-item">
                            <div class="info">
                                <img src="${p.images && p.images[0] ? p.images[0] : 'https://via.placeholder.com/40'}" alt="${p.title}" />
                                <div>
                                    <div class="title">${p.title}</div>
                                    <div class="category">
                                        ${p.category || 'General'} • Rs. ${p.price}
                                        ${p.colors && p.colors.length > 0 ? ` • ${p.colors.join(', ')}` : ''}
                                    </div>
                                </div>
                            </div>
                            <button class="btn-danger" onclick="deleteProduct(${i})">
                                <i class="fas fa-trash"></i>
                            </button>
                        </div>
                    `).join('');
                }
            }
            updateStats();
        }

        function updateStats() {
            document.getElementById('total-products').textContent = products.length;
            document.getElementById('total-categories').textContent = categories.length;
            document.getElementById('total-orders').textContent = localStorage.getItem('orderCount') || 0;
            document.getElementById('total-colors').textContent = detectedColors.length;
            document.getElementById('product-count').textContent = products.length;
        }

        function renderCategoriesBar() {
            const bar = document.getElementById('category-bar');
            if (!bar) return;
            let html = `<button class="cat-btn active" onclick="filterCategory('All', this)">All</button>`;
            categories.forEach(c => {
                html += `<button class="cat-btn" onclick="filterCategory('${c}', this)">${c}</button>`;
            });
            bar.innerHTML = html;
        }

        // ============================================
        // TOAST
        // ============================================
        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            if (!toast) { alert(message); return; }
            document.getElementById('toast-message').textContent = message;
            const titles = { success: '✅ Success!', error: '❌ Error!', warning: '⚠️ Warning', info: 'ℹ️ Info' };
            toast.querySelector('.toast-title').textContent = titles[type] || titles.success;
            toast.className = 'toast';
            if (type) toast.classList.add(type);
            toast.classList.add('show');
            clearTimeout(toast._timeout);
            toast._timeout = setTimeout(() => toast.classList.remove('show'), 3000);
        }

        // ============================================
        // RESET
        // ============================================
        function resetStorage() {
            if (confirm('⚠️ Delete ALL data?')) {
                localStorage.clear();
                showToast('Cleared! Refreshing...', 'warning');
                setTimeout(() => location.reload(), 1000);
            }
        }

        // ============================================
        // FILTER (Placeholder)
        // ============================================
        function filterCategory(cat, btn) {}

        // ============================================
        // EXPOSE
        // ============================================
        window.addOption = addOption;
        window.removeOption = removeOption;
        window.removeImage = removeImage;
        window.analyzeImagesForColors = analyzeImagesForColors;
        window.removeDetectedColor = removeDetectedColor;
        window.addProduct = addProduct;
        window.addProductSmart = addProductSmart;
        window.addCategory = addCategory;
        window.deleteCategory = deleteCategory;
        window.deleteProduct = deleteProduct;
        window.resetStorage = resetStorage;
        window.selectCategory = selectCategory;
        window.createNewCategory = createNewCategory;
        window.setupCategorySuggestions = setupCategorySuggestions;
        window.ensureCategoryExists = ensureCategoryExists;
        window.detectCategoryFromTitle = detectCategoryFromTitle;
    </script>
