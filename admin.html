<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Panel - Markaz Store</title>
    <link rel="stylesheet" href="style.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', sans-serif;
            background: #0a0a12;
            color: #ffffff;
            padding: 16px;
            min-height: 100vh;
        }
        .container { max-width: 500px; margin: 0 auto; }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            background: rgba(26, 26, 46, 0.85);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 16px;
            margin-bottom: 20px;
        }
        .header h1 {
            font-size: 1.2rem;
            font-weight: 800;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .header .actions {
            display: flex;
            gap: 10px;
        }
        .header .actions a {
            padding: 6px 14px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 8px;
            color: #a0a0b8;
            text-decoration: none;
            font-size: 0.75rem;
        }
        .btn-danger-sm {
            padding: 6px 14px;
            background: rgba(239,68,68,0.12);
            border: 1px solid rgba(239,68,68,0.2);
            border-radius: 8px;
            color: #ef4444;
            font-size: 0.75rem;
            cursor: pointer;
            font-family: inherit;
        }

        .stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }
        .stat-card {
            background: rgba(26, 26, 46, 0.85);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 12px;
            padding: 14px 18px;
            text-align: center;
        }
        .stat-card .label {
            font-size: 0.65rem;
            color: #a0a0b8;
            text-transform: uppercase;
        }
        .stat-card .value {
            font-size: 1.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .card {
            background: rgba(26, 26, 46, 0.85);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 16px;
        }
        .card h2 {
            font-size: 1rem;
            font-weight: 700;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .card h2 i { color: #6366f1; }

        .form-group {
            margin-bottom: 12px;
        }
        .form-group label {
            font-size: 0.8rem;
            font-weight: 500;
            color: #a0a0b8;
            display: block;
            margin-bottom: 4px;
        }
        .form-group label .required { color: #ef4444; }
        .form-group input {
            width: 100%;
            padding: 12px 16px;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 10px;
            color: #ffffff;
            font-size: 0.95rem;
            outline: none;
        }
        .form-group input:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99,102,241,0.1);
        }
        .form-group input::placeholder { color: #6a6a82; }
        .form-group small {
            font-size: 0.7rem;
            color: #6a6a82;
            display: block;
            margin-top: 4px;
        }
        .form-group small i { color: #6366f1; }

        .upload-area {
            border: 2px dashed rgba(255,255,255,0.08);
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            position: relative;
            background: rgba(255,255,255,0.02);
        }
        .upload-area input[type="file"] {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            opacity: 0;
            cursor: pointer;
        }
        .upload-area i {
            font-size: 2rem;
            color: #6366f1;
            display: block;
            margin-bottom: 4px;
        }
        .upload-area p { color: #a0a0b8; font-size: 0.85rem; }
        .upload-area .sub { color: #6a6a82; font-size: 0.7rem; }

        .preview-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(70px, 1fr));
            gap: 10px;
            margin-top: 12px;
        }
        .preview-item {
            position: relative;
            border-radius: 8px;
            overflow: hidden;
            aspect-ratio: 1;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.06);
        }
        .preview-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .preview-item .remove {
            position: absolute;
            top: 4px;
            right: 4px;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: rgba(0,0,0,0.7);
            border: none;
            color: white;
            cursor: pointer;
            font-size: 0.6rem;
        }

        .btn-primary {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .btn-primary:active { transform: scale(0.98); }

        .btn-secondary {
            width: 100%;
            padding: 14px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 10px;
            color: #a0a0b8;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            font-family: inherit;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-sm {
            padding: 6px 14px;
            font-size: 0.75rem;
            width: auto;
            display: inline-flex;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .form-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 8px;
        }

        .options-group {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 4px;
            min-height: 28px;
        }
        .option-tag {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 4px 10px 4px 12px;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 100px;
            font-size: 0.75rem;
        }
        .option-tag .remove {
            cursor: pointer;
            color: #ef4444;
            background: none;
            border: none;
            font-size: 0.8rem;
        }
        .option-input-row {
            display: flex;
            gap: 6px;
            margin-top: 6px;
        }
        .option-input-row input {
            flex: 1;
            padding: 6px 12px;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 8px;
            color: #ffffff;
            font-size: 0.85rem;
            outline: none;
        }
        .option-input-row input:focus { border-color: #6366f1; }

        .category-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 4px;
        }
        .category-tag {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 4px 10px 4px 12px;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 100px;
            font-size: 0.75rem;
        }
        .category-tag .remove {
            cursor: pointer;
            color: #ef4444;
            background: none;
            border: none;
            font-size: 0.8rem;
        }
        .category-input-row {
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
        }
        .category-input-row input {
            flex: 1;
            padding: 8px 14px;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 8px;
            color: #ffffff;
            font-size: 0.85rem;
            outline: none;
        }
        .category-input-row input:focus { border-color: #6366f1; }

        .product-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 14px;
            background: rgba(255,255,255,0.03);
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.06);
            margin-bottom: 6px;
            flex-wrap: wrap;
            gap: 6px;
        }
        .product-item .info {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .product-item .info img {
            width: 36px;
            height: 36px;
            object-fit: cover;
            border-radius: 6px;
        }
        .product-item .info .title { font-weight: 500; font-size: 0.85rem; }
        .product-item .info .meta {
            font-size: 0.65rem;
            color: #a0a0b8;
        }
        .product-item .btn-danger {
            padding: 4px 10px;
            font-size: 0.65rem;
        }

        .empty-state {
            text-align: center;
            padding: 30px 20px;
            color: #6a6a82;
        }
        .empty-state i {
            font-size: 2rem;
            display: block;
            margin-bottom: 8px;
        }

        .product-count {
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: white;
            padding: 2px 10px;
            border-radius: 100px;
            font-size: 0.65rem;
            font-weight: 600;
            margin-left: 8px;
        }

        .toast {
            position: fixed;
            bottom: 20px;
            left: 16px;
            right: 16px;
            background: rgba(26, 26, 46, 0.95);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 12px;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 9999;
            transform: translateY(120px);
            opacity: 0;
            transition: all 0.4s ease;
        }
        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }
        .toast-icon {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: rgba(16,185,129,0.12);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .toast-icon i { color: #10b981; font-size: 0.9rem; }
        .toast.error .toast-icon { background: rgba(239,68,68,0.12); }
        .toast.error .toast-icon i { color: #ef4444; }
        .toast-content { flex: 1; }
        .toast-title { font-size: 0.75rem; font-weight: 600; }
        .toast-message { font-size: 0.7rem; color: #a0a0b8; }
        .toast-close {
            background: none;
            border: none;
            color: #6a6a82;
            cursor: pointer;
            font-size: 1rem;
        }

        /* Debug Box - Mobile Friendly */
        .debug-box {
            background: rgba(0,0,0,0.6);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 8px;
            padding: 10px 14px;
            margin-top: 12px;
            font-family: monospace;
            font-size: 0.65rem;
            color: #10b981;
            max-height: 150px;
            overflow-y: auto;
            display: block;
        }
        .debug-box .error { color: #ef4444; }
        .debug-box .warn { color: #f59e0b; }
        .debug-box .info { color: #60a5fa; }
        .debug-box .success { color: #10b981; }

        @media (max-width: 480px) {
            .form-row { grid-template-columns: 1fr; }
            .form-actions { grid-template-columns: 1fr; }
            .stats { grid-template-columns: 1fr 1fr; gap: 8px; }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>⚙️ Admin</h1>
            <div class="actions">
                <a href="index.html"><i class="fas fa-store"></i></a>
                <button class="btn-danger-sm" onclick="resetStorage()"><i class="fas fa-trash-alt"></i></button>
            </div>
        </div>

        <div class="stats">
            <div class="stat-card">
                <div class="label">📦 Products</div>
                <div class="value" id="total-products">0</div>
            </div>
            <div class="stat-card">
                <div class="label">🏷️ Categories</div>
                <div class="value" id="total-categories">0</div>
            </div>
        </div>

        <div class="card">
            <h2><i class="fas fa-plus-circle"></i> Add Product</h2>

            <div class="form-group">
                <label>Title <span class="required">*</span></label>
                <input type="text" id="p-title" placeholder="e.g. Black T-Shirt" />
            </div>

            <div class="form-group">
                <label>Price (PKR) <span class="required">*</span></label>
                <input type="number" id="p-price" placeholder="1500" />
            </div>

            <div class="form-group">
                <label>Category</label>
                <input type="text" id="p-category" placeholder="Clothing, Watches, etc." />
                <small><i class="fas fa-magic"></i> Auto-detects from title</small>
            </div>

            <div class="form-group">
                <label>Images <span class="required">*</span></label>
                <div class="upload-area">
                    <i class="fas fa-cloud-upload-alt"></i>
                    <p>Tap to upload</p>
                    <span class="sub">Max 5 images</span>
                    <input type="file" id="p-images" accept="image/*" multiple />
                </div>
                <div class="preview-grid" id="preview-grid"></div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label><i class="fas fa-ruler"></i> Sizes</label>
                    <div class="options-group" id="sizes-container"></div>
                    <div class="option-input-row">
                        <input type="text" id="size-input" placeholder="S, M, L" />
                        <button class="btn-secondary btn-sm" onclick="addOption('size')">
                            <i class="fas fa-plus"></i>
                        </button>
                    </div>
                    <input type="hidden" id="p-sizes" value="[]" />
                </div>
                <div class="form-group">
                    <label><i class="fas fa-palette"></i> Colors</label>
                    <div class="options-group" id="colors-container"></div>
                    <div class="option-input-row">
                        <input type="text" id="color-input" placeholder="Black, White" />
                        <button class="btn-secondary btn-sm" onclick="addOption('color')">
                            <i class="fas fa-plus"></i>
                        </button>
                    </div>
                    <input type="hidden" id="p-colors" value="[]" />
                </div>
            </div>

            <div class="form-actions">
                <button class="btn-primary" onclick="addProduct()">
                    <i class="fas fa-plus"></i> Add Product
                </button>
                <button class="btn-secondary" onclick="addProductSmart()">
                    <i class="fas fa-magic"></i> Auto
                </button>
            </div>

            <!-- Debug Box -->
            <div class="debug-box" id="debug-box">
                <div class="success">✅ Ready</div>
            </div>
        </div>

        <div class="card">
            <h2><i class="fas fa-tags"></i> Categories</h2>
            <div class="category-input-row">
                <input type="text" id="new-cat-name" placeholder="New category..." />
                <button class="btn-secondary btn-sm" onclick="addCategory()">
                    <i class="fas fa-plus"></i>
                </button>
            </div>
            <div class="category-tags" id="categories-list"></div>
        </div>

        <div class="card">
            <h2>
                <i class="fas fa-box"></i> Products
                <span class="product-count" id="product-count">0</span>
            </h2>
            <div id="products-list"></div>
            <div class="empty-state" id="empty-state">
                <i class="fas fa-box-open"></i>
                No products
            </div>
        </div>
    </div>

    <div class="toast" id="toast">
        <div class="toast-icon"><i class="fas fa-check-circle"></i></div>
        <div class="toast-content">
            <span class="toast-title">Success!</span>
            <span class="toast-message" id="toast-msg">Done</span>
        </div>
        <button class="toast-close" onclick="this.parentElement.classList.remove('show')">
            <i class="fas fa-times"></i>
        </button>
    </div>

    <script>
        // ============================================
        // CONFIG - YOUR IMGBB API KEY
        // ============================================
        const IMGBB_API_KEY = '311cba478ef03480a9e99f45226dc6ac';

        // ============================================
        // STATE
        // ============================================
        let categories = JSON.parse(localStorage.getItem('myCategories')) || ['Watches', 'Clothing', 'Electronics'];
        let products = JSON.parse(localStorage.getItem('myProducts')) || [];
        let uploadedImages = [];
        let sizes = [];
        let colors = [];

        // ============================================
        // DEBUG FUNCTION
        // ============================================
        function debugLog(msg, type = 'info') {
            const box = document.getElementById('debug-box');
            if (!box) return;
            const colors = { info: '#60a5fa', error: '#ef4444', warn: '#f59e0b', success: '#10b981' };
            const time = new Date().toLocaleTimeString();
            box.innerHTML += `<div class="${type}">[${time}] ${msg}</div>`;
            box.scrollTop = box.scrollHeight;
            console.log(`[${type}]`, msg);
        }

        // ============================================
        // DOM READY
        // ============================================
        document.addEventListener('DOMContentLoaded', function() {
            debugLog('🚀 Admin loaded!', 'success');
            debugLog('📦 Products: ' + products.length, 'info');
            renderAll();
            setupImageUpload();
            loadOptions();
        });

        // ============================================
        // IMAGE UPLOAD - SAME AS BEFORE
        // ============================================
        function setupImageUpload() {
            const input = document.getElementById('p-images');
            if (!input) return;
            input.addEventListener('change', function(e) {
                const files = e.target.files;
                debugLog('📸 ' + files.length + ' images selected', 'info');
                for (let file of files) {
                    if (uploadedImages.length >= 5) {
                        showToast('Max 5 images!', 'warning');
                        break;
                    }
                    const reader = new FileReader();
                    reader.onload = function(event) {
                        uploadedImages.push(event.target.result);
                        renderPreviews();
                        debugLog('✅ Image ' + uploadedImages.length + ' loaded', 'success');
                    };
                    reader.readAsDataURL(file);
                }
                e.target.value = '';
            });
        }

        function renderPreviews() {
            const grid = document.getElementById('preview-grid');
            if (!grid) return;
            if (uploadedImages.length === 0) {
                grid.innerHTML = '';
                return;
            }
            grid.innerHTML = uploadedImages.map((img, i) => `
                <div class="preview-item">
                    <img src="${img}" alt="img" />
                    <button class="remove" onclick="removeImage(${i})">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
            `).join('');
        }

        function removeImage(index) {
            uploadedImages.splice(index, 1);
            renderPreviews();
            debugLog('🗑️ Image ' + (index+1) + ' removed', 'warn');
        }

        // ============================================
        // OPTIONS
        // ============================================
        function loadOptions() {
            const s = document.getElementById('p-sizes');
            const c = document.getElementById('p-colors');
            if (s && s.value) { sizes = JSON.parse(s.value); renderOptions('size'); }
            if (c && c.value) { colors = JSON.parse(c.value); renderOptions('color'); }
        }

        function addOption(type) {
            const input = document.getElementById(type === 'size' ? 'size-input' : 'color-input');
            const arr = type === 'size' ? sizes : colors;
            const hidden = type === 'size' ? 'p-sizes' : 'p-colors';
            const val = input.value.trim();
            if (!val) { showToast('Enter value!', 'error'); return; }
            if (arr.includes(val)) { showToast('Already exists!', 'warning'); return; }
            arr.push(val);
            document.getElementById(hidden).value = JSON.stringify(arr);
            input.value = '';
            renderOptions(type);
            debugLog('➕ Added ' + type + ': ' + val, 'success');
        }

        function removeOption(type, index) {
            const arr = type === 'size' ? sizes : colors;
            const hidden = type === 'size' ? 'p-sizes' : 'p-colors';
            arr.splice(index, 1);
            document.getElementById(hidden).value = JSON.stringify(arr);
            renderOptions(type);
        }

        function renderOptions(type) {
            const container = document.getElementById(type === 'size' ? 'sizes-container' : 'colors-container');
            const arr = type === 'size' ? sizes : colors;
            if (!container) return;
            if (arr.length === 0) { container.innerHTML = ''; return; }
            container.innerHTML = arr.map((item, i) => `
                <span class="option-tag">
                    ${item}
                    <button class="remove" onclick="removeOption('${type}', ${i})">×</button>
                </span>
            `).join('');
        }

        // ============================================
        // ADD PRODUCT - SAME WORKING METHOD
        // ============================================
        async function addProduct() {
            debugLog('🔴 addProduct() called', 'info');

            const title = document.getElementById('p-title').value.trim();
            const price = document.getElementById('p-price').value.trim();
            let category = document.getElementById('p-category').value.trim() || 'General';

            debugLog('📝 Title: "' + title + '", Price: "' + price + '", Category: "' + category + '"', 'info');

            if (!title || !price) {
                showToast('Title and Price required!', 'error');
                debugLog('❌ Missing title or price', 'error');
                return;
            }

            // Category auto-create
            category = ensureCategory(category);

            // Check images
            if (uploadedImages.length === 0) {
                showToast('Upload at least one image!', 'error');
                debugLog('❌ No images uploaded', 'error');
                return;
            }

            // ============================================
            // UPLOAD TO IMGBB - SAME WORKING METHOD
            // ============================================
            let imageUrls = [];
            showToast('📤 Uploading to IMGBB...', 'info');
            debugLog('📤 Starting IMGBB upload...', 'info');

            for (let i = 0; i < uploadedImages.length; i++) {
                try {
                    debugLog('📤 Uploading ' + (i+1) + '/' + uploadedImages.length + '...', 'info');
                    
                    // Convert base64 to blob
                    const response = await fetch(uploadedImages[i]);
                    const blob = await response.blob();
                    const formData = new FormData();
                    formData.append('image', blob);

                    // IMGBB API call - SAME AS BEFORE
                    const uploadRes = await fetch('https://api.imgbb.com/1/upload?key=' + IMGBB_API_KEY, {
                        method: 'POST',
                        body: formData
                    });

                    const result = await uploadRes.json();
                    debugLog('📤 IMGBB response: ' + JSON.stringify(result).substring(0, 100), 'info');

                    if (result.success) {
                        imageUrls.push(result.data.url);
                        debugLog('✅ Image ' + (i+1) + ' uploaded: ' + result.data.url.substring(0, 50) + '...', 'success');
                    } else {
                        debugLog('❌ IMGBB error: ' + (result.error?.message || 'Unknown'), 'error');
                        showToast('Upload failed: ' + (result.error?.message || 'Unknown'), 'error');
                        return;
                    }
                } catch (e) {
                    debugLog('❌ Upload error: ' + e.message, 'error');
                    showToast('Upload error: ' + e.message, 'error');
                    return;
                }
            }

            debugLog('✅ All ' + imageUrls.length + ' images uploaded!', 'success');

            // Get sizes & colors
            const sizes = JSON.parse(document.getElementById('p-sizes').value || '[]');
            const colors = JSON.parse(document.getElementById('p-colors').value || '[]');

            const product = {
                title: title,
                price: price,
                category: category,
                images: imageUrls,
                sizes: sizes,
                colors: colors,
                createdAt: new Date().toISOString()
            };

            debugLog('📦 Product: ' + JSON.stringify(product).substring(0, 200), 'info');

            // Save
            products.push(product);
            localStorage.setItem('myProducts', JSON.stringify(products));

            debugLog('✅ Product saved! Total: ' + products.length, 'success');

            // Clear form
            document.getElementById('p-title').value = '';
            document.getElementById('p-price').value = '';
            document.getElementById('p-category').value = '';
            document.getElementById('p-images').value = '';
            uploadedImages = [];
            sizes = [];
            colors = [];
            document.getElementById('p-sizes').value = '[]';
            document.getElementById('p-colors').value = '[]';
            renderPreviews();
            renderOptions('size');
            renderOptions('color');

            renderAll();
            showToast('✅ "' + title + '" added!', 'success');
            debugLog('🎉 Product "' + title + '" added successfully!', 'success');
        }

        // ============================================
        // ADD PRODUCT WITH AUTO-DETECT
        // ============================================
        async function addProductSmart() {
            debugLog('🧠 addProductSmart() called', 'info');
            const title = document.getElementById('p-title').value.trim();
            const price = document.getElementById('p-price').value.trim();

            if (!title || !price) {
                showToast('Title and Price required!', 'error');
                return;
            }

            const cat = detectCategory(title);
            if (cat) {
                document.getElementById('p-category').value = cat;
                showToast('🔍 "' + cat + '" detected!', 'info');
                debugLog('🔍 Category detected: "' + cat + '"', 'success');
            } else {
                debugLog('⚠️ No category detected', 'warn');
            }

            await addProduct();
        }

        // ============================================
        // CATEGORY HELPERS
        // ============================================
        function ensureCategory(name) {
            if (!name) return 'General';
            const trimmed = name.trim();
            const existing = categories.find(c => c.toLowerCase() === trimmed.toLowerCase());
            if (existing) return existing;
            categories.push(trimmed);
            localStorage.setItem('myCategories', JSON.stringify(categories));
            renderAll();
            showToast('🏷️ "' + trimmed + '" created', 'success');
            debugLog('🏷️ New category: "' + trimmed + '"', 'success');
            return trimmed;
        }

        function detectCategory(title) {
            const keywords = {
                'Watches': ['watch', 'smartwatch', 'chrono'],
                'Clothing': ['shirt', 'jeans', 'jacket', 'dress', 'hoodie', 'sweater', 'tshirt'],
                'Electronics': ['phone', 'laptop', 'tablet', 'tv', 'speaker'],
                'Shoes': ['shoe', 'sneaker', 'boot'],
                'Accessories': ['bag', 'belt', 'cap', 'hat', 'sunglass'],
                'Home': ['furniture', 'lamp', 'chair', 'table', 'bed'],
                'Books': ['book', 'novel', 'magazine'],
                'Toys': ['toy', 'game', 'puzzle', 'doll'],
                'Beauty': ['cream', 'lotion', 'shampoo', 'soap', 'perfume']
            };
            const lower = title.toLowerCase();
            for (const [cat, words] of Object.entries(keywords)) {
                for (const w of words) {
                    if (lower.includes(w)) return cat;
                }
            }
            return null;
        }

        function addCategory() {
            const name = document.getElementById('new-cat-name').value.trim();
            if (!name) { showToast('Enter name!', 'error'); return; }
            if (categories.includes(name)) { showToast('Already exists!', 'warning'); return; }
            categories.push(name);
            localStorage.setItem('myCategories', JSON.stringify(categories));
            document.getElementById('new-cat-name').value = '';
            renderAll();
            showToast('Category added!', 'success');
            debugLog('🏷️ Category added: "' + name + '"', 'success');
        }

        function deleteCategory(index) {
            if (!confirm('Delete?')) return;
            categories.splice(index, 1);
            localStorage.setItem('myCategories', JSON.stringify(categories));
            renderAll();
            showToast('Category deleted.', 'success');
        }

        function deleteProduct(index) {
            if (!confirm('Delete?')) return;
            products.splice(index, 1);
            localStorage.setItem('myProducts', JSON.stringify(products));
            renderAll();
            showToast('Product deleted.', 'success');
        }

        // ============================================
        // RENDER
        // ============================================
        function renderAll() {
            renderCategories();
            renderProducts();
            updateStats();
        }

        function renderCategories() {
            const list = document.getElementById('categories-list');
            if (!list) return;
            if (categories.length === 0) {
                list.innerHTML = '<span style="color:#6a6a82;font-size:0.75rem;">No categories</span>';
                return;
            }
            list.innerHTML = categories.map((c, i) => `
                <span class="category-tag">
                    ${c}
                    <button class="remove" onclick="deleteCategory(${i})">×</button>
                </span>
            `).join('');
        }

        function renderProducts() {
            const list = document.getElementById('products-list');
            const empty = document.getElementById('empty-state');
            if (!list) return;

            if (products.length === 0) {
                list.innerHTML = '';
                if (empty) empty.style.display = 'block';
                return;
            }
            if (empty) empty.style.display = 'none';

            list.innerHTML = products.map((p, i) => `
                <div class="product-item">
                    <div class="info">
                        <img src="${p.images && p.images[0] ? p.images[0] : 'https://via.placeholder.com/36'}" alt="${p.title}" />
                        <div>
                            <div class="title">${p.title}</div>
                            <div class="meta">
                                ${p.category || 'General'} • Rs. ${p.price}
                                ${p.colors && p.colors.length > 0 ? ' • ' + p.colors.join(', ') : ''}
                            </div>
                        </div>
                    </div>
                    <button class="btn-danger-sm" onclick="deleteProduct(${i})">
                        <i class="fas fa-trash"></i>
                    </button>
                </div>
            `).join('');
        }

        function updateStats() {
            document.getElementById('total-products').textContent = products.length;
            document.getElementById('total-categories').textContent = categories.length;
            document.getElementById('product-count').textContent = products.length;
        }

        // ============================================
        // TOAST
        // ============================================
        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            if (!toast) { alert(message); return; }
            document.getElementById('toast-msg').textContent = message;
            const titles = { success: '✅ Success!', error: '❌ Error!', warning: '⚠️ Warning', info: 'ℹ️ Info' };
            toast.querySelector('.toast-title').textContent = titles[type] || titles.success;
            toast.className = 'toast';
            if (type) toast.classList.add(type);
            toast.classList.add('show');
            clearTimeout(toast._timeout);
            toast._timeout = setTimeout(() => toast.classList.remove('show'), 3000);
        }

        // ============================================
        // RESET
        // ============================================
        function resetStorage() {
            if (confirm('⚠️ Delete ALL data?')) {
                localStorage.clear();
                showToast('Cleared! Refreshing...', 'warning');
                setTimeout(() => location.reload(), 1000);
            }
        }

        // ============================================
        // EXPOSE
        // ============================================
        window.addOption = addOption;
        window.removeOption = removeOption;
        window.removeImage = removeImage;
        window.addProduct = addProduct;
        window.addProductSmart = addProductSmart;
        window.addCategory = addCategory;
        window.deleteCategory = deleteCategory;
        window.deleteProduct = deleteProduct;
        window.resetStorage = resetStorage;
        window.ensureCategory = ensureCategory;
        window.detectCategory = detectCategory;
    </script>
</body>
</html>
