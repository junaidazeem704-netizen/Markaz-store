<!DOCTYPE html>
<html lang="ur">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Markaz Store - Online Shopping</title>
    <link rel="stylesheet" href="style.css">
    <!-- Tailwind CSS for Quick Layout -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans">

    <!-- Top Announcement Bar -->
    <div class="bg-indigo-600 text-white text-xs font-semibold text-center py-2 px-4 shadow-md">
        ⚡ LIMITED TIME OFFER — FREE DELIVERY ALL OVER PAKISTAN ON ORDERS ABOVE RS. 3000 🚚
    </div>

    <!-- Header Section -->
    <header class="border-b border-slate-800 bg-slate-900/80 backdrop-blur sticky top-0 z-50 px-4 py-3">
        <div class="max-w-xl mx-auto flex items-center justify-between">
            <a href="index.html" class="flex items-center gap-2 text-xl font-bold text-white">
                <span>🛍️</span>
                <span>Markaz Store</span>
                <span class="text-[10px] bg-indigo-900/80 text-indigo-300 border border-indigo-700/50 px-2 py-0.5 rounded-full font-mono">VERIFIED</span>
            </a>
            
            <a href="admin.html" class="text-xs bg-slate-800 hover:bg-slate-700 text-indigo-400 border border-slate-700 px-3 py-1.5 rounded-lg font-bold transition">
                ⚙️ Admin
            </a>
        </div>
    </header>

    <!-- Main Content Wrapper -->
    <main class="max-w-xl mx-auto p-4 space-y-6">

        <!-- Category Filter Buttons -->
        <div class="flex items-center gap-2 overflow-x-auto pb-2 scrollbar-none">
            <button class="category-btn active bg-indigo-600 text-white text-xs font-bold px-4 py-2 rounded-xl whitespace-nowrap transition" data-category="All">
                All
            </button>
            <button class="category-btn bg-slate-800 text-slate-300 hover:bg-slate-700 text-xs font-semibold px-4 py-2 rounded-xl whitespace-nowrap transition" data-category="Clothing">
                Clothing
            </button>
            <button class="category-btn bg-slate-800 text-slate-300 hover:bg-slate-700 text-xs font-semibold px-4 py-2 rounded-xl whitespace-nowrap transition" data-category="Electronics">
                Electronics
            </button>
            <button class="category-btn bg-slate-800 text-slate-300 hover:bg-slate-700 text-xs font-semibold px-4 py-2 rounded-xl whitespace-nowrap transition" data-category="Beauty">
                Beauty
            </button>
            <button class="category-btn bg-slate-800 text-slate-300 hover:bg-slate-700 text-xs font-semibold px-4 py-2 rounded-xl whitespace-nowrap transition" data-category="Watches">
                Watches
            </button>
        </div>

        <!-- 🎯 PRODUCT DISPLAY CONTAINER (Yahan Products Render Honge) -->
        <div id="product-container" class="grid grid-cols-1 gap-4">
            <!-- Products script.js ke zariye yahan load honge -->
            <p class="text-center text-slate-500 text-xs py-8">Loading products...</p>
        </div>

    </main>

    <!-- Footer Section -->
    <footer class="border-t border-slate-900 text-center py-6 text-xs text-slate-500 mt-12">
        © 2026 Markaz Store. All rights reserved.
    </footer>

    <!-- Main Script Link -->
    <script src="script.js"></script>
</body>
</html>
