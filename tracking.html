<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Track Your Order - Markaz Store</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <nav class="navbar">
        <div class="container nav-flex">
            <a href="index.html" class="logo"><i class="fas fa-shopping-bag"></i> MARKAZ<span>.</span></a>
        </div>
    </nav>

    <div class="container" style="max-width:600px; margin-top:50px;">
        <div style="background:var(--bg-card); padding:24px; border-radius:16px; border:1px solid var(--border);">
            <h2>Track Order Status</h2>
            <div style="display:flex; gap:10px; margin:20px 0;">
                <input type="text" id="track-id-input" placeholder="Enter Order ID (e.g. MK-123456)" style="flex:1; padding:10px; background:var(--bg-main); border:1px solid var(--border); color:#fff; border-radius:8px;">
                <button class="btn btn-primary" onclick="trackOrder()">Search</button>
            </div>
            <div id="track-result"></div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://vnzipnxrasonkhlwcynq.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZuemlwbnhyYXNvbmtobHdjeW5xIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDA5MjY0ODcsImV4cCI6MjA1NjUwMjQ4N30.KfgUQ-fn1L0A_Jv3pFESuC8jR1R7S_iC9RPNlWpTbJ0';
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        document.addEventListener('DOMContentLoaded', () => {
            const id = new URLSearchParams(window.location.search).get('id');
            if (id) {
                document.getElementById('track-id-input').value = id;
                trackOrder();
            }
        });

        async function trackOrder() {
            const id = document.getElementById('track-id-input').value.trim();
            if(!id) return;

            const resDiv = document.getElementById('track-result');
            resDiv.innerHTML = 'Searching...';

            const { data } = await supabase.from('orders').select('*').eq('order_id', id).single();

            if (data) {
                resDiv.innerHTML = `
                    <div style="background:var(--bg-main); padding:16px; border-radius:12px; margin-top:16px;">
                        <p style="margin-bottom:6px;"><strong>Status:</strong> <span style="color:var(--primary); text-transform:uppercase; font-weight:700;">${data.status}</span></p>
                        <p style="margin-bottom:6px;"><strong>Customer:</strong> ${data.name}</p>
                        <p style="margin-bottom:6px;"><strong>Address:</strong> ${data.address}</p>
                        <p><strong>Total Amount:</strong> Rs. ${data.total}</p>
                    </div>
                `;
            } else {
                resDiv.innerHTML = `<p style="color:#ef4444; margin-top:16px;">Order not found. Please check Order ID.</p>`;
            }
        }
    </script>
</body>
</html>
