<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Products - Markaz Store</title>
    <link rel="stylesheet" href="style.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .products-page { padding: 100px 24px 60px; min-height: 100vh; }
        .products-page .container { max-width: 1280px; margin: 0 auto; }
        .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; }
        .category-filter { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-bottom: 32px; }
        .cat-btn { padding: 8px 16px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08); border-radius: 20px; color: white; cursor: pointer; }
        .cat-btn.active { background: #6366f1; border-color: #6366f1; }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="nav-container">
            <div class="logo"><i class="fas fa-store-alt"></i><span>Markaz</span></div>
            <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="products.html" class="active">Products</a>
                <a href="contact.html">Contact</a>
            </div>
            <button class="nav-btn" onclick="window.location.href='cart.html'"><i class="fas fa-shopping-bag"></i> <span id="cart-badge">0</span></button>
        </div>
    </nav>

    <section class="products-page">
        <div class="container">
            <div class="category-filter" id="category-filter"></div>
            <div class="products-grid" id="products-container"></div>
        </div>
    </section>

    <script>
        const SUPABASE_URL = 'https://vnzipnxrasonkhlwcynq.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZuemlwbnhyYXNvbmtobHdjeW5xIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDA5MjY0ODcsImV4cCI6MjA1NjUwMjQ4N30.KfgUQ-fn1L0A_Jv3pFESuC8jR1R7S_iC9RPNlWpTbJ0';
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let allProducts = [];
        let categoriesList = [];

        document.addEventListener('DOMContentLoaded', async function() {
            await fetchProductsAndCategories();
        });

        async function fetchProductsAndCategories() {
            const { data: pData } = await supabase.from('products').select('*').order('created_at', { ascending: false });
            if (pData) allProducts = pData;

            const { data: cData } = await supabase.from('categories').select('*');
            if (cData) categoriesList = cData.map(c => c.name);

            renderCategoryFilter();
            displayProducts(allProducts);
        }

        function renderCategoryFilter() {
            const container = document.getElementById('category-filter');
            let html = `<button class="cat-btn active" onclick="filterCategory('All', this)">All</button>`;
            categoriesList.forEach(cat => {
                html += `<button class="cat-btn" onclick="filterCategory('${cat}', this)">${cat}</button>`;
            });
            container.innerHTML = html;
        }

        function filterCategory(cat, btn) {
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
            if (btn) btn.classList.add('active');
            if (cat === 'All') displayProducts(allProducts);
            else displayProducts(allProducts.filter(p => p.category === cat));
        }

        function displayProducts(list) {
            const container = document.getElementById('products-container');
            container.innerHTML = list.map((p, i) => `
                <div class="card" onclick="viewProduct(${i})" style="background:rgba(26,26,46,0.85);padding:12px;border-radius:12px;cursor:pointer;">
                    <img src="${p.images?.[0] || 'https://via.placeholder.com/200'}" style="width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;">
                    <h3>${p.title}</h3>
                    <div style="color:#6366f1;font-weight:700;">Rs. ${p.price}</div>
                </div>
            `).join('');
        }

        function viewProduct(index) {
            localStorage.setItem('viewProduct', JSON.stringify(allProducts[index]));
            window.location.href = 'product-detail.html';
        }
    </script>
</body>
</html>
