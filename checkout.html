<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Checkout - Markaz Store</title>
    <link rel="stylesheet" href="style.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <style>
        .checkout-wrapper {
            max-width: 900px;
            margin: 0 auto;
            padding: 40px 24px;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .checkout-card {
            background: var(--bg-card);
            border: var(--border);
            border-radius: var(--radius-lg);
            padding: 40px 48px;
            width: 100%;
            box-shadow: var(--shadow-lg);
        }

        .checkout-header {
            text-align: center;
            margin-bottom: 32px;
        }

        .checkout-header .logo-icon {
            font-size: 2.4rem;
            color: var(--accent);
            margin-bottom: 8px;
        }

        .checkout-header h1 {
            font-size: 1.8rem;
            font-weight: 800;
        }

        .checkout-header p {
            color: var(--text-secondary);
        }

        .checkout-summary {
            background: var(--bg-primary);
            border-radius: var(--radius-md);
            padding: 20px 24px;
            margin-bottom: 28px;
            border: var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        .checkout-summary .product-info {
            display: flex;
            flex-direction: column;
        }

        .checkout-summary .product-info .title {
            font-weight: 600;
            font-size: 1.1rem;
        }

        .checkout-summary .product-info .category {
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        .checkout-summary .price {
            font-size: 1.6rem;
            font-weight: 700;
            color: var(--accent);
        }

        .checkout-form {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .checkout-form .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .checkout-form .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .checkout-form .form-group label {
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-secondary);
        }

        .checkout-form .form-group label .required {
            color: var(--danger);
        }

        .checkout-form .form-group input,
        .checkout-form .form-group textarea {
            padding: 14px 18px;
            background: var(--bg-primary);
            border: var(--border);
            border-radius: var(--radius-sm);
            color: var(--text-primary);
            font-size: 0.95rem;
            font-family: inherit;
            transition: var(--transition);
            outline: none;
        }

        .checkout-form .form-group input:focus,
        .checkout-form .form-group textarea:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }

        .checkout-form .form-group input::placeholder,
        .checkout-form .form-group textarea::placeholder {
            color: var(--text-muted);
        }

        .checkout-form .form-group textarea {
            resize: vertical;
            min-height: 80px;
        }

        .checkout-form .form-group .input-icon {
            position: relative;
        }

        .checkout-form .form-group .input-icon i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
        }

        .checkout-form .form-group .input-icon input {
            padding-left: 42px;
        }
