<!DOCTYPE html>
<html lang="ur">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details - Markaz Store</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .slide-anim { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0.5; } to { opacity: 1; } }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans pb-10">

    <header class="border-b border-slate-800 bg-slate-900 sticky top-0 z-50 px-4 py-3">
        <div class="max-w-md mx-auto flex items-center justify-between">
            <a href="index.html" class="text-indigo-400 font-bold text-xs">← Back to Store</a>
            <span class="text-xs font-bold text-slate-300">Markaz Store</span>
        </div>
    </header>

    <main class="max-w-md mx-auto p-4 space-y-5">

        <!-- 📸 PHOTO CAROUSEL -->
        <div class="bg-slate-900 rounded-2xl border border-slate-800 overflow-hidden shadow-2xl relative">
            <div class="relative w-full aspect-[4/5] bg-slate-950 flex items-center justify-center">
                <img id="sliderImg" src="" class="w-full h-full object-cover slide-anim" />

                <button onclick="prevImg()" class="absolute left-2 bg-slate-950/80 text-white w-8 h-8 rounded-full flex items-center justify-center border border-slate-700">❮</button>
                <button onclick="nextImg()" class="absolute right-2 bg-slate-950/80 text-white w-8 h-8 rounded-full flex items-center justify-center border border-slate-700">❯</button>
            </div>
            <div id="dots" class="flex justify-center gap-1.5 py-2.5 bg-slate-900 border-t border-slate-800"></div>
        </div>

        <!-- 🏷️ DETAILS & OPTIONS -->
        <div class="bg-slate-900 p-5 rounded-2xl border border-slate-800 space-y-4 shadow-xl">
            <h1 id="pTitle" class="text-lg font-bold text-white"></h1>
            <div class="flex items-baseline gap-3">
                <span id="pPrice" class="text-2xl font-extrabold text-emerald-400"></span>
                <span id="pOriginalPrice" class="text-xs text-slate-500 line-through"></span>
            </div>

            <!-- SIZE SELECTOR -->
            <div class="border-t border-slate-800 pt-3">
                <label class="block text-xs font-bold text-slate-400 mb-2">SELECT SIZE:</label>
                <div id="sizeBox" class="flex flex-wrap gap-2"></div>
            </div>

            <!-- COLOR SELECTOR -->
            <div class="border-t border-slate-800 pt-3">
                <label class="block text-xs font-bold text-slate-400 mb-2">SELECT COLOR:</label>
                <div id="colorBox" class="flex flex-wrap gap-2"></div>
            </div>

            <button onclick="goToCheckout()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3.5 rounded-xl transition text-base shadow-lg mt-2">
                🛍️ Buy Now (Confirm Details)
            </button>
        </div>

    </main>

    <script>
        let pData = null;
        let images = [];
        let imgIdx = 0;
        let selectedSize = "";
        let selectedColor = "";

        document.addEventListener("DOMContentLoaded", () => {
            const raw = localStorage.getItem('previewProduct');
            if(!raw) { window.location.href = "index.html"; return; }

            pData = JSON.parse(raw);
            document.getElementById('pTitle').innerText = pData.title;
            document.getElementById('pPrice').innerText = "Rs. " + pData.price;
            document.getElementById('pOriginalPrice').innerText = "Rs. " + Math.round(pData.price * 1.25);

            images = pData.images || [pData.imageUrl || pData.image];
            renderSlider();

            // Render Sizes
            const sizes = pData.sizes || ["Standard"];
            selectedSize = sizes[0];
            document.getElementById('sizeBox').innerHTML = sizes.map((s, i) => `
                <button onclick="selectSize('${s}', this)" class="size-btn ${i===0?'bg-indigo-600 text-white':'bg-slate-800 text-slate-300'} text-xs font-bold px-3.5 py-2 rounded-xl border border-slate-700">
                    ${s}
                </button>
            `).join('');

            // Render Colors
            const colors = pData.colors || ["Default"];
            selectedColor = colors[0];
            document.getElementById('colorBox').innerHTML = colors.map((c, i) => `
                <button onclick="selectColor('${c}', this)" class="color-btn ${i===0?'bg-indigo-600 text-white':'bg-slate-800 text-slate-300'} text-xs font-bold px-3.5 py-2 rounded-xl border border-slate-700">
                    ${c}
                </button>
            `).join('');
        });

        function renderSlider() {
            document.getElementById('sliderImg').src = images[imgIdx];
            document.getElementById('dots').innerHTML = images.map((_, i) => `
                <span class="h-2 rounded-full ${i===imgIdx?'w-5 bg-indigo-500':'w-2 bg-slate-700'}"></span>
            `).join('');
        }

        function nextImg() { imgIdx = (imgIdx + 1) % images.length; renderSlider(); }
        function prevImg() { imgIdx = (imgIdx - 1 + images.length) % images.length; renderSlider(); }

        function selectSize(size, btn) {
            selectedSize = size;
            document.querySelectorAll('.size-btn').forEach(b => {
                b.className = "size-btn bg-slate-800 text-slate-300 text-xs font-bold px-3.5 py-2 rounded-xl border border-slate-700";
            });
            btn.className = "size-btn bg-indigo-600 text-white text-xs font-bold px-3.5 py-2 rounded-xl border border-indigo-500";
        }

        function selectColor(color, btn) {
            selectedColor = color;
            document.querySelectorAll('.color-btn').forEach(b => {
                b.className = "color-btn bg-slate-800 text-slate-300 text-xs font-bold px-3.5 py-2 rounded-xl border border-slate-700";
            });
            btn.className = "color-btn bg-indigo-600 text-white text-xs font-bold px-3.5 py-2 rounded-xl border border-indigo-500";
        }

        function goToCheckout() {
            localStorage.setItem('selectedProduct', JSON.stringify({
                title: `${pData.title} (${selectedSize} / ${selectedColor})`,
                price: pData.price,
                size: selectedSize,
                color: selectedColor,
                imageUrl: images[imgIdx]
            }));
            window.location.href = "checkout.html";
        }
    </script>
</body>
</html>
