<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Panel - Markaz Store</title>
    <link rel="stylesheet" href="style.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <style>
        /* Admin Panel Specific Styles */
        .admin-wrapper {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 30px;
            background: var(--bg-card);
            border: var(--border);
            border-radius: var(--radius-lg);
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .admin-header h1 {
            font-size: 1.8rem;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .admin-header h1 i {
            color: var(--accent);
        }

        .admin-header-actions {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .admin-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .admin-stat-card {
            background: var(--bg-card);
            border: var(--border);
            border-radius: var(--radius-md);
            padding: 20px 24px;
            transition: var(--transition);
        }

        .admin-stat-card:hover {
            border-color: var(--accent);
            transform: translateY(-2px);
        }

        .admin-stat-card .label {
            font-size: 0.8rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .admin-stat-card .value {
            font-size: 2rem;
            font-weight: 700;
            margin-top: 4px;
            color: var(--accent);
        }

        .admin-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
        }

        .admin-card {
            background: var(--bg-card);
            border: var(--border);
            border-radius: var(--radius-lg);
            padding: 24px 28px;
            margin-bottom: 24px;
        }

        .admin-card.full {
            grid-column: 1 / -1;
        }

        .admin-card h2 {
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .admin-card h2 i {
            color: var(--accent);
        }

        .admin-card .badge {
            background: var(--accent);
            color: white;
            font-size: 0.7rem;
            padding: 2px 12px;
            border-radius: 100px;
            margin-left: 8px;
        }

        /* Form Styles */
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 16px;
        }

        .form-row.three {
            grid-template-columns: 1fr 1fr 1fr;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-group label {
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-secondary);
        }

        .form-group label .required {
            color: var(--danger);
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            padding: 12px 16px;
            background: var(--bg-primary);
            border: var(--border);
            border-radius: var(--radius-sm);
            color: var(--text-primary);
            font-size: 0.95rem;
            font-family: inherit;
            transition: var(--transition);
            outline: none;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }

        .form-group input::placeholder,
        .form-group textarea::placeholder {
            color: var(--text-muted);
        }

        .form-group textarea {
            resize: vertical;
            min-height: 60px;
        }

        .form-actions {
            display: flex;
            gap: 12px;
            margin-top: 8px;
            flex-wrap: wrap;
        }

        /* Multiple Images Upload */
        .image-upload-area {
            border: 2px dashed rgba(255,255,255,0.1);
            border-radius: var(--radius-sm);
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: var(--transition);
            position: relative;
        }

        .image-upload-area:hover {
            border-color: var(--accent);
        }

        .image-upload-area input[type="file"] {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            opacity: 0;
            cursor: pointer;
        }

        .image-upload-area i {
            font-size: 2.4rem;
            color: var(--accent);
            display: block;
            margin-bottom: 8px;
        }

        .image-upload-area p {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        .image-upload-area .sub {
            color: var(--text-muted);
            font-size: 0.75rem;
        }

        .image-preview-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
            gap: 12px;
            margin-top: 12px;
        }

        .image-preview-item {
            position: relative;
            border-radius: var(--radius-sm);
            overflow: hidden;
            aspect-ratio: 1;
            background: var(--bg-primary);
            border: var(--border);
        }

        .image-preview-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .image-preview-item .remove-img {
            position: absolute;
            top: 4px;
            right: 4px;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: rgba(0,0,0,0.7);
            border: none;
            color: white;
            cursor: pointer;
            font-size: 0.7rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
        }

        .image-preview-item .remove-img:hover {
            background: var(--danger);
        }

        /* Options (Size & Color) */
        .options-group {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 4px;
        }

        .option-tag {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 14px 6px 18px;
            background: var(--bg-primary);
            border: var(--border);
            border-radius: 100px;
            font-size: 0.85rem;
        }

        .option-tag .remove {
            cursor: pointer;
            color: var(--danger);
            background: none;
            border: none;
            font-size: 1rem;
        }

        .option-input-row {
            display: flex;
            gap: 8px;
            margin-top: 8px;
        }

        .option-input-row input {
            flex: 1;
            padding: 8px 14px;
            background: var(--bg-primary);
            border: var(--border);
            border-radius: var(--radius-sm);
            color: var(--text-primary);
            font-size: 0.9rem;
        }

        .option-input-row button {
            padding: 8px 16px;
        }

        /* Product List */
        .product-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 400px;
            overflow-y: auto;
        }

        .product-list-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background: var(--bg-primary);
            border-radius: var(--radius-sm);
            border: var(--border);
            transition: var(--transition);
            flex-wrap: wrap;
            gap: 10px;
        }

        .product-list-item:hover {
            border-color: var(--border-hover);
        }

        .product-list-item .info {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .product-list-item .info img {
            width: 48px;
            height: 48px;
            object-fit: cover;
            border-radius: var(--radius-sm);
        }

        .product-list-item .info .details .title {
            font-weight: 500;
        }

        .product-list-item .info .details .meta {
            font-size: 0.75rem;
            color: var(--text-secondary);
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .product-list-item .info .details .meta span {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .product-list-item .actions {
            display: flex;
            gap: 8px;
        }

        .btn-sm {
            padding: 6px 14px;
            font-size: 0.8rem;
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-muted);
        }

        .empty-state i {
            font-size: 2.4rem;
            display: block;
            margin-bottom: 12px;
        }

        /* Category Tags */
        .category-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .category-tag {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 14px 6px 18px;
            background: var(--bg-primary);
            border: var(--border);
            border-radius: 100px;
            font-size: 0.85rem;
        }

        .category-tag .remove {
            cursor: pointer;
            color: var(--danger);
            background: none;
            border: none;
            font-size: 1rem;
            transition: var(--transition);
        }

        .category-tag .remove:hover {
            transform: scale(1.2);
        }

        /* Responsive */
        @media (max-width: 1024px) {
            .admin-grid {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 768px) {
            .form-row {
                grid-template-columns: 1fr;
            }
            .form-row.three {
                grid-template-columns: 1fr;
            }
            .admin-header {
                flex-direction: column;
                text-align: center;
            }
            .admin-header-actions {
                justify-content: center;
            }
            .product-list-item {
                flex-direction: column;
                align-items: stretch;
            }
            .product-list-item .actions {
                justify-content: flex-end;
            }
        }
    </style>
</head>
<body>

    <div class="admin-wrapper">
        <!-- Admin Header -->
        <header class="admin-header">
            <h1>
                <i class="fas fa-crown"></i>
                Store Management
            </h1>
            <div class="admin-header-actions">
                <a href="index.html" class="btn-secondary btn-sm">
                    <i class="fas fa-store"></i> View Store
                </a>
                <button class="btn-danger btn-sm" onclick="resetStorage()">
                    <i class="fas fa-trash-alt"></i> Reset Data
                </button>
            </div>
        </header>

        <!-- Stats -->
        <div class="admin-stats">
            <div class="admin-stat-card">
                <div class="label">📦 Total Products</div>
                <div class="value" id="total-products">0</div>
            </div>
            <div class="admin-stat-card">
                <div class="label">🏷️ Categories</div>
                <div class="value" id="total-categories">0</div>
            </div>
            <div class="admin-stat-card">
                <div class="label">📊 Orders</div>
                <div class="value" id="total-orders">0</div>
            </div>
            <div class="admin-stat-card">
                <div class="label">👥 Customers</div>
                <div class="value" id="total-customers">0</div>
            </div>
        </div>

        <!-- Admin Grid -->
        <div class="admin-grid">
            <!-- Add Product -->
            <div class="admin-card full">
                <h2><i class="fas fa-plus-circle"></i> Add New Product</h2>
                
                <div class="form-row">
                    <div class="form-group">
                        <label>Product Title <span class="required">*</span></label>
                        <input type="text" id="p-title" placeholder="e.g. Premium Smart Watch" />
                    </div>
                    <div class="form-group">
                        <label>Price (PKR) <span class="required">*</span></label>
                        <input type="number" id="p-price" placeholder="e.g. 2500" />
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Category <span class="required">*</span></label>
                        <div class="suggestions-container">
                            <input type="text" id="p-category-input" placeholder="Type or auto-detect" />
                            <div class="suggestions-dropdown" id="category-suggestions-product"></div>
                        </div>
                        <input type="hidden" id="p-category" />
                        <small style="color:var(--text-muted);font-size:0.75rem;">
                            <i class="fas fa-magic" style="color:var(--accent);"></i> Auto-detects from product title
                        </small>
                    </div>
                    <div class="form-group">
                        <label>Multiple Images <span class="required">*</span></label>
                        <div class="image-upload-area">
                            <i class="fas fa-cloud-upload-alt"></i>
                            <p>Click to upload images</p>
                            <span class="sub">PNG, JPG, WEBP (Max 5 images)</span>
                            <input type="file" id="p-images" accept="image/*" multiple />
                        </div>
                        <div class="image-preview-grid" id="image-preview-grid"></div>
                        <input type="hidden" id="p-images-data" value="[]" />
                    </div>
                </div>

                <!-- Size Options -->
                <div class="form-row">
                    <div class="form-group">
                        <label><i class="fas fa-ruler"></i> Sizes (Clothing)</label>
                        <div class="options-group" id="sizes-container"></div>
                        <div class="option-input-row">
                            <input type="text" id="size-input" placeholder="e.g. S, M, L, XL" />
                            <button class="btn-secondary btn-sm" onclick="addOption('size')">
                                <i class="fas fa-plus"></i> Add
                            </button>
                        </div>
                        <input type="hidden" id="p-sizes" value="[]" />
                    </div>
                    <div class="form-group">
                        <label><i class="fas fa-palette"></i> Colors</label>
                        <div class="options-group" id="colors-container"></div>
                        <div class="option-input-row">
                            <input type="text" id="color-input" placeholder="e.g. Black, White, Blue" />
                            <button class="btn-secondary btn-sm" onclick="addOption('color')">
                                <i class="fas fa-plus"></i> Add
                            </button>
                        </div>
                        <input type="hidden" id="p-colors" value="[]" />
                    </div>
                </div>

                <div class="form-actions">
                    <button class="btn-primary" onclick="addProduct()">
                        <i class="fas fa-plus"></i> Add Product
                    </button>
                    <button class="btn-secondary" onclick="addProductSmart()">
                        <i class="fas fa-magic"></i> Auto-Detect
                    </button>
                </div>
            </div>

            <!-- Manage Categories -->
            <div class="admin-card">
                <h2><i class="fas fa-tags"></i> Categories</h2>
                <div style="display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;">
                    <div style="flex:1;min-width:150px;">
                        <div class="suggestions-container">
                            <input type="text" id="new-cat-name" placeholder="New category..." />
                            <div class="suggestions-dropdown" id="category-suggestions"></div>
                        </div>
                    </div>
                    <button class="btn-primary btn-sm" onclick="addCategory()">
                        <i class="fas fa-plus"></i> Add
                    </button>
                </div>
                <div class="category-tags" id="categories-list"></div>
            </div>

            <!-- Manage Products -->
            <div class="admin-card">
                <h2>
                    <i class="fas fa-box"></i> All Products
                    <span class="badge" id="product-count">0</span>
                </h2>
                <div class="product-list" id="admin-products-list"></div>
                <div class="empty-state" id="empty-products">
                    <i class="fas fa-box-open"></i>
                    No products added yet
                </div>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast">
        <div class="toast-icon">
            <i class="fas fa-check-circle"></i>
        </div>
        <div class="toast-content">
            <span class="toast-title">Success!</span>
            <span class="toast-message" id="toast-message">Product added successfully</span>
        </div>
        <button class="toast-close" onclick="this.parentElement.classList.remove('show')">
            <i class="fas fa-times"></i>
        </button>
    </div>

    <script src="script.js"></script>
    <script src="admin-script.js"></script>
</body>
</html>
