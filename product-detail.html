<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details - Markaz Store</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .product-flex { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; margin-top: 40px; }
        .main-img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 12px; border: 1px solid var(--border); }
        .thumb-grid { display: flex; gap: 10px; margin-top: 10px; overflow-x: auto; }
        .thumb { width: 60px; height: 60px; object-fit: cover; border-radius: 8px; cursor: pointer; border: 2px solid transparent; }
        .thumb.active { border-color: var(--primary); }
        .swatch-btn { padding: 6px 14px; border: 1px solid var(--border); background: var(--bg-card); color: #fff; border-radius: 6px; cursor: pointer; margin-right: 6px; }
        .swatch-btn.active { border-color: var(--primary); background: var(--primary); }
        @media(max-width:768px) { .product-flex { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="container nav-flex">
            <a href="index.html" class="logo"><i class="fas fa-shopping-bag"></i> MARKAZ<span>.</span></a>
            <a href="cart.html" class="cart-btn"><i class="fas fa-shopping-cart"></i> Cart <span class="cart-count" id="cart-count">0</span></a>
        </div>
    </nav>

    <div class="container product-flex" id="product-container">
        <div>Loading product details...</div>
    </div>

    <script>
        const SUPABASE_URL = 'https://vnzipnxrasonkhlwcynq.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZuemlwbnhyYXNvbmtobHdjeW5xIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDA5MjY0ODcsImV4cCI6MjA1NjUwMjQ4N30.KfgUQ-fn1L0A_Jv3pFESuC8jR1R7S_iC9RPNlWpTbJ0';
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentProduct = null;
        let selectedColor = '', selectedSize = '';

        document.addEventListener('DOMContentLoaded', async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const id = urlParams.get('id');
            if (id) await fetchProduct(id);
            updateCartBadge();
        });

        async function fetchProduct(id) {
            const { data } = await supabase.from('products').select('*').eq('id', id).single();
            if (!data) return;
            currentProduct = data;
            selectedColor = data.colors?.[0] || 'Default';
            selectedSize = data.sizes?.[0] || 'Standard';

            const container = document.getElementById('product-container');
            container.innerHTML = `
                <div>
                    <img src="${data.images?.[0] || 'https://via.placeholder.com/400'}" id="main-product-img" class="main-img">
                    <div class="thumb-grid">
                        ${(data.images || []).map((img, i) => `
                            <img src="${img}" class="thumb ${i===0?'active':''}" onclick="changeImg('${img}', this)">
                        `).join('')}
                    </div>
                </div>
                <div>
                    <span style="color:var(--primary); font-size:0.8rem; text-transform:uppercase;">${data.category}</span>
                    <h1 style="font-size:1.8rem; margin:8px 0;">${data.title}</h1>
                    <h2 style="color:var(--accent); margin-bottom:16px;">Rs. ${data.price}</h2>
                    <p style="color:var(--text-muted); line-height:1.5; margin-bottom:20px;">${data.description || 'Premium quality product.'}</p>

                    ${data.colors?.length ? `
                        <div style="margin-bottom:16px;">
                            <label style="display:block; font-size:0.85rem; margin-bottom:6px;">Select Color:</label>
                            ${data.colors.map((c, i) => `<button class="swatch-btn ${i===0?'active':''}" onclick="selectColor('${c}', this)">${c}</button>`).join('')}
                        </div>
                    ` : ''}

                    ${data.sizes?.length ? `
                        <div style="margin-bottom:24px;">
                            <label style="display:block; font-size:0.85rem; margin-bottom:6px;">Select Size:</label>
                            ${data.sizes.map((s, i) => `<button class="swatch-btn ${i===0?'active':''}" onclick="selectSize('${s}', this)">${s}</button>`).join('')}
                        </div>
                    ` : ''}

                    <div style="display:flex; gap:12px;">
                        <button class="btn btn-primary" onclick="addToCart(false)" style="flex:1;"><i class="fas fa-cart-plus"></i> Add to Cart</button>
                        <button class="btn btn-outline" onclick="addToCart(true)" style="flex:1; background:var(--accent); border:none;"><i class="fas fa-bolt"></i> Buy Now</button>
                    </div>
                </div>
            `;
        }

        function changeImg(src, el) {
            document.getElementById('main-product-img').src = src;
            document.querySelectorAll('.thumb').forEach(t => t.classList.remove('active'));
            el.classList.add('active');
        }

        function selectColor(color, el) {
            selectedColor = color;
            el.parentElement.querySelectorAll('.swatch-btn').forEach(b => b.classList.remove('active'));
            el.classList.add('active');
        }

        function selectSize(size, el) {
            selectedSize = size;
            el.parentElement.querySelectorAll('.swatch-btn').forEach(b => b.classList.remove('active'));
            el.classList.add('active');
        }

        function addToCart(redirect = false) {
            if (!currentProduct) return;
            let cart = JSON.parse(localStorage.getItem('cart') || '[]');
            const existingIndex = cart.findIndex(item => item.id === currentProduct.id && item.color === selectedColor && item.size === selectedSize);

            if (existingIndex > -1) {
                cart[existingIndex].quantity += 1;
            } else {
                cart.push({
                    id: currentProduct.id,
                    title: currentProduct.title,
                    price: currentProduct.price,
                    image: currentProduct.images?.[0] || '',
                    color: selectedColor,
                    size: selectedSize,
                    quantity: 1
                });
            }

            localStorage.setItem('cart', JSON.stringify(cart));
            updateCartBadge();
            if (redirect) window.location.href = 'cart.html';
            else alert('✅ Product added to cart!');
        }

        function updateCartBadge() {
            const cart = JSON.parse(localStorage.getItem('cart') || '[]');
            document.getElementById('cart-count').innerText = cart.reduce((acc, item) => acc + item.quantity, 0);
        }
    </script>
</body>
</html>
